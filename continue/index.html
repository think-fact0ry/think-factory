<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>생각공작소</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="apple-touch-icon" href="/assets/android-icon-192x192.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  think-factory.kr/continue — 서비스 종료 안내 알림톡 버튼 뒤 화면(오감쑥쑥을 마치는 가정). ?k=<열쇠>로만 열린다(06 이어가기.js cont_get, cont_ask, cont_stop).
  열쇠 없음, 틀림 = 안내 한 줄. 방문 통계 없음(주소에 열쇠가 있어서). 설계 = 부모 레포 prototype/07_종료안내_버튼뒤화면_A_프리뷰.html.
  ⚠️디자인을 고칠 땐 그 프리뷰와 같이. 06 배포 ID가 아래 GAS06에 박혀 있다(새 배포 금지).
-->
<style>
:root{
  --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g800:#333d4b; --g900:#191f28;
  --green500:#57a77a; --green600:#3a8a5f; --green700:#166841; --gtrack:#cfe6d8;
  --green100:#e9f8ee; --green300:#a7e7c0; --green800:#01492a; --ink-on-dark:#F9FBFA;
  --dark:#525966;
  --r-md:clamp(10px,2.6vw,14px); --r-lg:clamp(13px,3.2vw,20px);
  --col:430px;
  --band-bg:#f0f8f3;
  --sf-bot:linear-gradient(to bottom,rgba(22,104,65,0) 0%,rgba(22,104,65,.055) 100%),
           linear-gradient(to bottom,rgba(22,104,65,0) 58%,rgba(22,104,65,.115) 100%);
  --sf-top:linear-gradient(to top,rgba(22,104,65,0) 0%,rgba(22,104,65,.055) 100%),
           linear-gradient(to top,rgba(22,104,65,0) 58%,rgba(22,104,65,.115) 100%);
}
.ban .t i{font-style:normal;animation:wv 2.55s ease-in-out infinite;animation-delay:calc(600ms + var(--i) * 55ms)}
@keyframes wv{0%,23.53%,100%{color:var(--g900)} 11.76%{color:var(--green700)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
*{box-sizing:border-box}
html{background:#fff;overscroll-behavior-y:none}
body{margin:0;height:100svh;overflow:hidden;display:flex;flex-direction:column;font-family:'Pretendard Variable','Pretendard',system-ui,sans-serif;color:var(--g900);word-break:keep-all;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.pg{width:100%;max-width:var(--col);margin:0 auto;background:#fff;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.vp{position:relative;flex:1 1 auto;min-height:0}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:none}
.scr::-webkit-scrollbar{width:0;height:0}
.scr.drag{cursor:grabbing}
.fd{position:absolute;left:0;right:0;height:32px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.fd.t{top:0;background:var(--sf-top)}
.fd.b{bottom:0;background:var(--sf-bot)}
.fd.on{opacity:1}
.foot{flex:none;background:#fff}
.foot{transition:margin-bottom .32s cubic-bezier(.22,.7,.25,1)}
.pg.fh .foot{margin-bottom:calc(-1 * var(--fh, 163px))}
.pg.fnt .foot{transition:none}
.top{padding:36px 24px 22px;position:relative}
.brand{font-size:13px;line-height:20px;font-weight:600;color:var(--g600);margin:0 0 28px}
.ban{position:absolute;z-index:1;top:12px;left:16px;right:16px;display:flex;align-items:center;gap:7px;background:var(--g100);color:var(--g900);border-radius:14px;padding:11px 38px 11px 12px;font-weight:700;margin:0;transition:opacity .25s,transform .25s}
.ban .gift{width:18px;height:18px;flex:none;color:var(--green600)}
.ban .t{white-space:nowrap;overflow:hidden;font-size:15px;line-height:1.4;min-width:0;flex:1}
.ban .x{all:unset;cursor:pointer;position:absolute;top:50%;right:2px;width:36px;height:36px;margin-top:-18px;display:flex;align-items:center;justify-content:center;color:var(--g600);border-radius:10px}
.ban .x svg{width:16px;height:16px}
.ban.gone{opacity:0;transform:translateY(-6px)}
@media (max-width:340px){.top{padding-left:20px;padding-right:20px}.ban{left:12px;right:12px}.ban .gift{display:none}}
h1{font-size:28px;line-height:1.36;letter-spacing:-.6px;font-weight:700;margin:0 0 12px}
.sub{font-size:16.5px;color:var(--g700);margin:0}
.band{background:var(--band-bg);padding:22px 24px}
.lbl{font-size:15px;font-weight:700;color:var(--green700);margin:0 0 14px;display:flex;align-items:center;gap:6px}
.lbl .sp{width:20px;height:20px;margin:-2px 0 -2px auto;flex:none;overflow:visible}
.lbl.near .sp{margin-left:0}
.seg,.tl{display:grid;grid-template-columns:repeat(12,1fr);column-gap:4px}
.seg i{height:9px;border-radius:5px;background:var(--gtrack);transition:background .35s}
.seg i.a{background:var(--green600)}
.tl{font-size:12.5px;color:var(--g700);margin:6px 0 0;white-space:nowrap}
.tl span:nth-child(1){grid-column:1/4}
.tl span:nth-child(2){grid-column:4/8}
.tl span:nth-child(3){grid-column:8/11}
.tl span:nth-child(4){grid-column:11/13;text-align:right}
.now{display:flex;align-items:baseline;gap:8px;margin:16px 0 14px}
.won{font-size:44px;font-weight:800;letter-spacing:-1.3px;line-height:1.05;font-variant-numeric:tabular-nums;transition:opacity .35s}
.won.fade{opacity:0}
.won small{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-left:2px}
.u{font-size:15px;color:var(--g700);font-weight:600}
.th{display:flex;justify-content:flex-end;font-size:12.5px;font-weight:600;color:var(--g700);margin:0 0 4px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;color:var(--g700);border-top:1px solid rgba(58,138,95,.14);transition:color .3s}
.rows li b{font-weight:600;color:var(--g900);font-variant-numeric:tabular-nums}
.rows li.cur{color:var(--green700);font-weight:700}.rows li.cur b{color:var(--green700);font-weight:700}
.total{font-size:14px;color:var(--g700);margin:14px 0 0}
.pics{padding:22px 0 0}
.pics h2{margin:0}
.igt{display:grid;grid-template-columns:repeat(3,1fr);--u:calc(min(100vw, var(--col)) / 1080);margin:0 0 calc(var(--u) * 1)}
.igt span{cursor:default;-webkit-user-select:none;user-select:none}
.igt svg{transition:transform .12s}
.igt span.press svg{transform:scale(.93)}
.igt span{position:relative;display:flex;justify-content:center;height:calc(var(--u) * 98)}
.igt svg{width:calc(var(--u) * 60);height:calc(var(--u) * 60);color:var(--g600)}
.igt .on svg{color:var(--g900)}
.igt .on::after{content:'';position:absolute;left:25%;right:25%;bottom:0;height:calc(var(--u) * 6);background:var(--g900)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(min(100vw, var(--col)) * 6 / 1080)}
.tile{aspect-ratio:3/4;background:var(--g100);overflow:hidden}
.tile img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.tile.in img{opacity:1}
.tile.ct img{object-position:50% var(--cy,0%);transform:scale(var(--cz,1));transform-origin:50% 0}
.act{padding:24px 24px 0}
.btn{position:relative;overflow:hidden;display:block;width:100%;border:0;text-align:center;border-radius:16px;padding:17px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn.fill{background:var(--green600);color:#fff}
.btn.fill:active{background:var(--green700);transform:scale(.97)}
.rip{position:absolute;z-index:0;border-radius:50%;background:rgba(0,0,0,.18);transform:translate(-50%,-50%) scale(0);pointer-events:none;width:30px;height:30px}
.rip.go{transition:transform .46s ease-out;transform:translate(-50%,-50%) scale(var(--rs,16))}
.bl{position:relative;z-index:1}
.btn.text{background:none;color:var(--g600);font-size:14.5px;font-weight:500;padding:13px;min-height:44px}
.alt{display:flex;justify-content:space-between;align-items:center;margin:22px 24px 0;padding:18px 0 24px;border-top:1px solid var(--g100);font-size:15.5px;color:var(--g700);cursor:pointer}
.alt svg{width:20px;height:20px;color:var(--g500);flex:none}
.alt > *{transition:transform .12s}
.alt.press > *{transform:scale(.93)}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;background:var(--g800);color:#F9FBFA;font-size:13.5px;font-weight:600;line-height:1.5;white-space:pre-line;text-align:left;border-radius:12px;padding:12px 18px;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.toast.plain .tk{display:none}
.toast .tk{width:18px;height:18px;border-radius:50%;background:var(--green600);flex:none;display:inline-flex;align-items:center;justify-content:center}
.toast .tk svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn.wait{background:var(--g100);color:var(--dark)}
.btn.wait:active{background:var(--dark);color:#fff;transform:scale(.985)}
.btn.wait.done{cursor:default}
.btn.wait.done:active{background:var(--g100);color:var(--dark);transform:none}
.bad{display:none;flex:1 1 auto;flex-direction:column;justify-content:center;padding:24px;text-align:center}
.bad h2{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.4;margin:0 0 8px}
.bad p{font-size:16px;color:var(--g700);line-height:1.6;margin:0}
.pg.isbad>.vp,.pg.isbad>.foot{display:none}
.pg.isbad>.bad{display:flex}
.dim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s;will-change:opacity}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:9;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));width:calc(100% - 16px);max-width:calc(var(--col) - 16px);background:#fff;border-radius:24px;padding:0 24px 24px;transform:translate(-50%,calc(100% + 24px));transition:transform .32s cubic-bezier(.22,.7,.25,1);will-change:transform;touch-action:none}
.sheet.on{transform:translate(-50%,0)}
.sheet.grab{transition:none}
.sheet.press{scale:.97;transition:scale .12s}
.sheet .hd{height:26px;display:flex;align-items:center;justify-content:center;cursor:grab}
.sheet .hd i{width:40px;height:4px;border-radius:2px;background:var(--g200)}
.sheet .bd{padding-top:10px}
.sheet .bd>*{will-change:transform,opacity;margin:0 0 18px}
.sheet.on .bd>*{animation:up .6s cubic-bezier(.22,.7,.25,1) backwards}
.sheet.on .bd>*:nth-child(1){animation-delay:.06s}.sheet.on .bd>*:nth-child(2){animation-delay:.16s}.sheet.on .bd>*:nth-child(3){animation-delay:.26s}.sheet.on .bd>*:nth-child(4){animation-delay:.36s}.sheet.on .bd>*:nth-child(5){animation-delay:.46s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sheet h3{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.4}
.sheet .btn.fill{margin-bottom:0}
.sheet .btn.text{margin-bottom:-10px}
a.btn{text-decoration:none;box-sizing:border-box}
.sheet p{font-size:16px;color:var(--g700);line-height:1.6}
.cdim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.cdim.on{opacity:1;pointer-events:auto}
.cmodal{position:fixed;left:50%;top:50%;z-index:31;width:calc(100% - 84px);max-width:320px;background:#fff;border-radius:var(--r-lg);padding:24px 22px 18px;text-align:left;opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.96);transition:opacity .2s,transform .2s}
.cmodal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cmodal h3{font-size:17px;font-weight:700;line-height:1.45;margin:0 0 8px}
.cmodal p{font-size:14px;line-height:1.5;color:var(--g600);margin:0 0 16px}
.cmodal .row{display:flex;gap:8px}
.cm-btn{position:relative;overflow:hidden;flex:1;padding:13px;border:0;border-radius:var(--r-md);font:inherit;font-size:15px;font-weight:700;background:var(--g100);color:var(--g700);cursor:pointer}
.cm-btn:active{background:var(--g200)}
.cm-btn.primary{background:var(--green600);color:#fff}
.cm-btn.primary:active{background:var(--green700)}
@media (prefers-reduced-motion:reduce){ .foot,.won,.seg i,.ban,.sheet,.dim,.fd,.tile img,.cdim,.cmodal,.btn,.rip.go{transition:none} .sheet.on .bd>*{animation:none} .ban .t i{animation:none} }
.outdim{display:none}
@media (min-width:480px) and (hover:hover) and (pointer:fine){
  html,body{background:var(--g200)}
  body{padding-top:19px}
  .outdim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s}
  .outdim.on{opacity:1}
  .pg{max-width:min(var(--col),calc(100% - 38px));height:100%;position:relative;overflow:hidden;overflow:clip;border-radius:40px 40px 0 0;box-shadow:0 8px 20px rgba(25,31,40,.15);transform:translateZ(0)}
  .pg > .vp{background:#fff;border-radius:40px 40px 0 0}
  .pg:has(> .cdim.on){background-color:rgb(153,153,153)}
  .pg:has(> .dim.on){background-color:rgb(148,148,148)}
  .sheet,.toast{height:auto}
}
</style></head>
<body>
<div class="outdim" id="outdim"></div>
<div class="pg fh">
 <div class="bad" id="bad"><h2>링크가 맞지 않아요</h2><p>카카오톡으로 받은 링크를 다시 눌러 주세요.</p></div>
 <div class="vp">
  <div class="scr" id="scr">
  <div class="rb" id="rb">
  <div class="top">
    <p class="brand">생각공작소</p>
    <h1>바우처가 끝나도<br>지금처럼 이어 갈까요?</h1>
    <p class="sub">가정 방문으로 바우처 없이 수업해요 ☺️</p>
  </div>
  <div class="band">
    <p class="lbl" id="lbl"><span>다니실수록 수업료가 내려가요</span><svg class="sp" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="spG" gradientUnits="userSpaceOnUse" x1="0" y1="22.5" x2="0" y2="2.5"><stop offset="0" style="stop-color:var(--green600)"/><stop id="spA" offset="0" style="stop-color:var(--green600)"/><stop id="spB" offset="0" style="stop-color:var(--gtrack)"/><stop offset="1" style="stop-color:var(--gtrack)"/></linearGradient></defs><path d="M12 21.5V12" fill="none" stroke="url(#spG)" stroke-width="2.2" stroke-linecap="round"/><path d="M12 13.2C12 8.6 9.3 5.6 4.3 5.6c0 4.6 2.8 7.6 7.7 7.6z" fill="url(#spG)"/><path d="M12 11.4c0-4.3 2.6-7.1 7.4-7.1 0 4.3-2.6 7.1-7.4 7.1z" fill="url(#spG)"/></svg></p>
    <div class="seg" id="seg"></div>
    <div class="tl"><span>1개월</span><span>4개월</span><span>8개월</span><span>12개월</span></div>
    <div class="now"><span class="won" id="won"></span><span class="u">1회기</span></div>
    <div class="th">1회기 기준</div>
    <ul class="rows" id="rows"></ul>
    <p class="total">첫 3개월은 한 달에 130,000원이에요.</p>
  </div>
  <div class="pics">
    <h2 class="sr">생각공작소 활동 피드</h2>
    <div class="igt" aria-hidden="true">
      <span class="on"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1.6" y="1.6" width="5.6" height="5.6" rx="1.4"/><rect x="9.2" y="1.6" width="5.6" height="5.6" rx="1.4"/><rect x="16.8" y="1.6" width="5.6" height="5.6" rx="1.4"/><rect x="1.6" y="9.2" width="5.6" height="5.6" rx="1.4"/><rect x="9.2" y="9.2" width="5.6" height="5.6" rx="1.4"/><rect x="16.8" y="9.2" width="5.6" height="5.6" rx="1.4"/><rect x="1.6" y="16.8" width="5.6" height="5.6" rx="1.4"/><rect x="9.2" y="16.8" width="5.6" height="5.6" rx="1.4"/><rect x="16.8" y="16.8" width="5.6" height="5.6" rx="1.4"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"><rect x="2.2" y="2.2" width="19.6" height="19.6" rx="5.6"/><path d="M9.6 8.2v7.6a.7.7 0 0 0 1.07.6l5.9-3.8a.7.7 0 0 0 0-1.2l-5.9-3.8a.7.7 0 0 0-1.07.6z"/></svg></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"><path d="M5 5.2h3l1.6-2.5h4.8l1.6 2.5h3a2.6 2.6 0 0 1 2.6 2.6v11.4a2.6 2.6 0 0 1-2.6 2.6H5a2.6 2.6 0 0 1-2.6-2.6V7.8A2.6 2.6 0 0 1 5 5.2z"/><circle cx="12" cy="11.4" r="3"/><path d="M6.6 19.6c.9-2.5 2.9-3.9 5.4-3.9s4.5 1.4 5.4 3.9"/></svg></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  </div>
  <div class="ban" id="ban">
    <svg class="gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M3 7h18v3H3z"/><path d="M12 7v13"/><path d="M12 7c-1.4-2.8-4.8-3-4.8-1.1C7.2 7 10 7 12 7zm0 0c1.4-2.8 4.8-3 4.8-1.1C16.8 7 14 7 12 7z"/></svg>
    <span class="t" id="banT">오감쑥쑥을 마치는 가정에게만 드리는 혜택</span>
    <button class="x" type="button" id="banX" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  </div>
  <i class="fd t" id="fdT"></i><i class="fd b" id="fdB"></i>
 </div>
  <div class="foot">
  <div class="act"><button class="btn fill" type="button" id="go">우리 선생님과 다시 이어 갈게요 →</button></div>
  <div class="alt" id="alt" role="button" tabindex="0"><span>바우처로 이어 가고 싶으시다면</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
  </div>
<div class="cdim" id="cdim"></div>
<div class="cmodal" id="cmodal" role="alertdialog" aria-modal="true" aria-labelledby="cmT"><h3 id="cmT">조금 더 생각해 볼까요?</h3><p>언제든 다시 여쭤볼 수 있어요.</p><div class="row"><button class="cm-btn" type="button" id="cmNo">아니요</button><button class="cm-btn primary" type="button" id="cmYes">멈출게요</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="tk"><svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17 19 7.5"/></svg></span><span id="toastT"></span></div>

<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var P = [32500, 30875, 29250], W = ['첫 3개월','4개월부터','8개월부터'], R = [[0,3],[3,7],[7,12]];
