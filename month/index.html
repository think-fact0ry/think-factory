<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>월 계획안 — 생각공작소</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="생각공작소 월 계획안">
<meta property="og:description" content="이번 달 계획안과 안내문이에요.">
<meta property="og:type" content="website">
<!--
  think-factory.kr/month — 월 계획안 알림톡 버튼 「이번 달 계획안 보기」가 여는 곳(주소는 템플릿 심사본에 박힘 → 바꾸면 재심사).
  대체문자도 이 주소를 준다. 설계 정본 = 부모 레포 docs/4_설계_2026-09-29_월안내_센터발송.md §3·§6, 신청용 = prototype/월계획안_알림톡템플릿_제출_프리뷰.html.
  1판(10-12) = 첫 발송 전 자리 지킴이: 다음 달 계획안이 1일에 올라온다는 안내 + 문의 번호. 템플릿 심사 중에 버튼이 빈 주소가 아니게.
  2단계(10-30) = 이번 달 포스터 + 안내문 전문을 07 공개 창구에서 받아 그린다(PLAN이 차면 render가 계획안 판으로 바뀐다).
  noindex = 이용 가정만 보는 글(본인부담금 계좌 등). 방문 통계(js/analytics.js)는 싣지 않음 — /monitoring·/receipt와 같은 결(이용자 개인 맥락).
  카톡 인앱 탈출 없음 — 읽기만 하는 화면이라 인앱에서 그대로 본다. ⚠️ 사용자 문구에 가운뎃점(U+00B7) 금지.
-->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --g100:#f2f4f6; --g200:#e5e8eb; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g800:#333d4b; --g900:#191f28;
    --green100:#e9f8ee; --green600:#3a8a5f; --green700:#166841;
    --beige:#f7f5f1;
    --r-md:clamp(10px,2.6vw,14px); --r-lg:clamp(13px,3.2vw,20px);
    --fs-h1:clamp(26px,3.4vw,30px);   /* §3.6-5 위계 ≥2× = 최소 글자 13px의 두 배 */
    --sh1:0 1px 2px rgba(47,111,77,.05), 0 4px 14px rgba(47,111,77,.06);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--beige); }
  body{ font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif; color:var(--g900); line-height:1.6;
    -webkit-text-size-adjust:100%; word-break:keep-all; overflow-wrap:anywhere; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:460px; margin:0 auto; padding:28px 16px 40px; }
  .brand{ font-size:13px; font-weight:700; color:var(--green600); letter-spacing:-.2px; margin:0 0 6px; }
  h1{ font-size:var(--fs-h1); line-height:1.3; letter-spacing:-.6px; margin:0 0 20px; }
  .card{ background:#fff; border-radius:var(--r-lg); box-shadow:var(--sh1); padding:28px 22px; text-align:center; }
  .card svg{ width:88px; height:88px; display:block; margin:0 auto 14px; }
  .card .t{ font-size:19px; font-weight:700; letter-spacing:-.4px; line-height:1.4; margin:0 0 8px; }
  .card .s{ font-size:15px; color:var(--g700); margin:0; }
  .poster{ display:block; width:100%; height:auto; border-radius:var(--r-md); }
  .notice{ background:#fff; border-radius:var(--r-lg); box-shadow:var(--sh1); padding:20px; margin-top:14px; white-space:pre-line; font-size:15px; }
  .ask{ margin:22px 4px 0; font-size:13px; color:var(--g700); }   /* 베이지 위 보조 글자 = g700(§3.6-7, g600은 4.5 미달) */
  .ask a{ color:var(--green700); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<main class="wrap">
  <p class="brand">생각공작소</p>
  <h1 id="ttl">월 계획안</h1>
  <div id="body"></div>
  <p class="ask">궁금하신 사항은 담당 선생님 또는 생각공작소(<a href="tel:0322772007">032-277-2007</a>)로 편하게 연락주세요.</p>
</main>
<script>
// 2단계에서 07 공개 창구가 채운다: { m: 11, poster: '그림 주소', text: '안내문 전문' }. 1판은 비어 있어 자리 지킴이로 그린다.
var PLAN = null;
var CAL = '<svg viewBox="0 0 160 160" aria-hidden="true"><defs>'
  + '<linearGradient id="lt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c5f4d8"/><stop offset="1" stop-color="#8fcaa9"/></linearGradient>'
  + '<linearGradient id="dk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fcaa9"/><stop offset="1" stop-color="#5fa880"/></linearGradient>'
  + '<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ebe9b"/><stop offset=".5" stop-color="#7ebe9b"/><stop offset=".5" stop-color="#519e72"/><stop offset="1" stop-color="#519e72"/></linearGradient></defs>'
  + '<rect x="22" y="30" width="116" height="112" rx="18" fill="url(#lt)"/>'
  + '<path d="M80 30 H120 Q138 30 138 48 V124 Q138 142 120 142 H80 Z" fill="url(#dk)"/>'
  + '<path d="M40 30 H120 Q138 30 138 48 V60 H22 V48 Q22 30 40 30 Z" fill="url(#bd)"/>'
  + '<rect x="47" y="17" width="13" height="27" rx="6.5" fill="#F9FBFA"/><rect x="100" y="17" width="13" height="27" rx="6.5" fill="#F9FBFA"/>'
  + '<g fill="#F9FBFA" fill-opacity=".92"><rect x="36" y="72" width="16" height="16" rx="5"/><rect x="60" y="72" width="16" height="16" rx="5"/><rect x="84" y="72" width="16" height="16" rx="5"/><rect x="108" y="72" width="16" height="16" rx="5"/>'
  + '<rect x="36" y="96" width="16" height="16" rx="5"/><rect x="60" y="96" width="16" height="16" rx="5"/><rect x="108" y="96" width="16" height="16" rx="5"/>'
  + '<rect x="36" y="120" width="16" height="12" rx="5"/><rect x="60" y="120" width="16" height="12" rx="5"/><rect x="84" y="120" width="16" height="12" rx="5"/></g>'
  + '<circle cx="92" cy="104" r="12" fill="#F9FBFA"/><circle cx="92" cy="104" r="6" fill="#519e72"/></svg>';

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(){
  var box = document.getElementById('body');
  if (PLAN && PLAN.text) {
    document.getElementById('ttl').textContent = PLAN.m + '월 계획안';
    box.innerHTML = (PLAN.poster ? '<img class="poster" src="' + esc(PLAN.poster) + '" alt="' + esc(PLAN.m) + '월 계획안 그림">' : '')
      + '<div class="notice">' + esc(PLAN.text) + '</div>';
    return;
  }
  // 자리 지킴이: 한국 시각 기준 다음 달 1일
  var now = new Date(Date.now() + 9 * 3600 * 1000);
  var next = now.getUTCMonth() + 2; if (next > 12) next = 1;
  box.innerHTML = '<div class="card">' + CAL
    + '<p class="t">' + next + '월 계획안은 ' + next + '월 1일에 올라와요</p>'
    + '<p class="s">매달 1일, 그 달 계획안과 안내문을 여기서 볼 수 있어요.</p></div>';
}
render();
</script>
</body>
</html>
