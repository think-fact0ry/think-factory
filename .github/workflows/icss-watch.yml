name: 지원단 공고 감시

# 인천 지원단(icss.kr) 이용자 모집 게시판을 읽어 data/icss.json에 쌓는다(공개 공고만). 머리 주석 = tools/icss-watch.mjs.
# 소비자(다음 단계): 22 추천서 신청 기간, 홈페이지 신청 기간 페이지, 카톡 알림, 블로그 초안.
# 2026-10-29 수동 실행으로 2026년 공고 23건을 첨부 실측표와 대조(오감, 아청심 48/48 같음) → 예약 실행 켬.
# 주기(유성 10-29 「달 단위 아니지? 올라오면 바로?」): 평일 한국 8~19시 15분마다, 그 밖 1시간마다. GitHub 부하로 몇~십몇 분 늦을 수 있음.
on:
  schedule:
    - cron: '37 * * * *'            # 늘 1시간마다(매시 37분)
    - cron: '7,22,52 23 * * 0-4'    # 평일 한국 8시대(UTC 전날 23시) — 37분은 위 줄이 맡음
    - cron: '7,22,52 0-9 * * 1-5'   # 평일 한국 9~18시대
  workflow_dispatch:
    inputs:
      args:
        description: 'tools/icss-watch.mjs에 넘길 것(예: --backfill --since=2025-01-01)'
        required: false
        default: ''
      commit:
        description: '결과를 data/icss.json에 커밋'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: icss-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 지원단 게시판 읽기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARGS: ${{ inputs.args }}
        run: node tools/icss-watch.mjs $ARGS

      - name: 결과 파일 남기기(확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icss
          path: data/icss.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 바뀐 것만 커밋, 푸시
        if: github.event_name != 'workflow_dispatch' || inputs.commit
        run: |
          git config user.name "think-factory-bot"
          git config user.email "noreply@think-factory.kr"
          git add -- data/icss.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 지원단 공고 자동 반영 ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
