<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>안전교육 — 생각공작소</title>
<meta name="robots" content="noindex">
<!--
  think-factory.kr/safety — 이용자 안전교육 카드 덱(2026-10-11, 유성 「2 카드 덱」 확정 → 실제 화면). 옛 14 GAS ?mode=safety iframe 래퍼를 갈아 끼움.
  입구 = 07 안전교육 알림톡 버튼 「안전교육 보기」 → /safety?for=child|adult&k=#{키}(주소는 템플릿 심사본에 박힘 → 바꾸면 재심사) / 대체문자 = 열쇠 없이 ?for=만.
  서버 = 14 웹앱 doPost(safe_open / safe_done / safe_warm, Code.js 맨 끝 절). 이름은 서버가 돌려주지 않고 화면에도 없다
  (열쇠 GO 때 약속 — 링크가 전달돼도 아이 이름, 상담 이용 사실이 안 드러나게). 열쇠 없으면 끝에서 이름 + 생년월일.
  정본 화면 = prototype/안전교육_웹_E디자인_화면.html(디자인 라운드는 거기서, 여기는 실서비스 판). 원칙 = docs/1 §5.7(다음 유도), §4.11(뒤로), §4.13-6(아래 띠).
  ?demo=1 = 서버 없이 화면만(헤드리스 확인용, &mom=1 = 엄마 카드) / ?at=N = 그 장 바로. ⚠️ 사용자 문구에 가운뎃점(U+00B7) 금지.
-->
<script>
// 카톡 인앱 브라우저 = 상하단 바가 카드와 버튼을 가린다 → 기본 브라우저로(/monitoring, /recommend와 같은 결, 유성 2026-07-08)
(function(){ if (/KAKAOTALK/i.test(navigator.userAgent) && !/demo=1/.test(location.search)) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); })();
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db; --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g800:#333d4b; --g900:#191f28;
    --green50:#f8fbf9; --green100:#e9f8ee; --green200:#cef2db; --green300:#a7e7c0; --green400:#7bcb9c; --green500:#57a77a; --green600:#3a8a5f; --green700:#166841; --green800:#01492a;
    --green:var(--green600); --green-dark:var(--green700);
    --warn:#f5a623; --warn-weak-bg:#fef4e2; --warn-weak-fg:#8a5a00; --dark:#525966;
    --p-disabled:#b7e0c8; --ink-on-dark:#F9FBFA;
    --r-sm:clamp(7px,1.8vw,10px); --r-md:clamp(10px,2.6vw,14px); --r-lg:clamp(13px,3.2vw,20px);
    --fs-h1:clamp(23px,3.4vw,30px); --fs-h2:clamp(20px,2.6vw,26px); --fs-title:17px; --fs-body:15px;
    --beige:#f7f5f1; --cream:#fbf7ef;
    /* 그림자 — kr site.css 그린틴트 2겹(§3.4). 버튼은 한 단 진하게(램프 상한 안) */
    --sh1:0 1px 2px rgba(47,111,77,.05), 0 4px 14px rgba(47,111,77,.06);
    --sh2:0 2px 8px rgba(47,111,77,.08), 0 12px 30px rgba(47,111,77,.12);
    --sh-btn:0 1px 2px rgba(47,111,77,.10), 0 6px 16px rgba(47,111,77,.12);
    --red:#f04452;   /* 에러 상태(§3.1) — 끝 이름 칸 */
    /* 스크롤 그라디언트 §4.13-6(§3.1 정본 값) — 아래쪽만(위쪽 띠는 14, 16처럼 뺌: 글자 위에 얹히면 막으로 읽힘) */
    --sf-bot:linear-gradient(to bottom,rgba(22,104,65,0) 0%,rgba(22,104,65,.055) 100%),
             linear-gradient(to bottom,rgba(22,104,65,0) 58%,rgba(22,104,65,.115) 100%);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--beige); }
  body{ font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif; color:var(--g900); line-height:1.6;
    -webkit-text-size-adjust:100%; word-break:keep-all; -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:default; }
  input{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; cursor:text; }
  img{ -webkit-user-drag:none; user-select:none; pointer-events:none; }
  .wrap{ max-width:460px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:20px 18px 22px; position:relative; }
  .scr{ display:none; flex-direction:column; flex:1; }
  .scr.on{ display:flex; }
  .spacer{ flex:1; min-height:18px; }

  /* ── 버튼(14 Index 실코드 + ripple §5.3) ── */
  .btn{ flex-shrink:0; width:100%; padding:16px; border:none; border-radius:15px; font-family:inherit; line-height:1.5;
    font-size:16px; font-weight:700; color:#fff; background:var(--green); cursor:pointer;
    transition:background .2s, transform .1s; letter-spacing:-.3px; position:relative; overflow:hidden; }
  .btn:active{ background:var(--green-dark); transform:scale(.97); }
  .btn .bl{ position:relative; z-index:1; }
  .btn .rip{ position:absolute; z-index:0; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:rgba(0,0,0,.20); pointer-events:none; transform:scale(0); }
  .btn .rip.go{ transform:scale(var(--rs,16)); opacity:0; transition:transform .46s ease-out, opacity .46s ease-out; }
  .btn:disabled{ background:var(--p-disabled); color:#fff; }
  .btn:disabled:active{ background:var(--p-disabled); transform:none; }
  .btn.gate{ background:var(--p-disabled); }   /* 아직 못 눌러요(§4.1-5 게이팅 색) — disabled 대신 클래스: 눌렀을 때 흔들림이 확실히 온다 */
  .btn.gate:active{ background:var(--p-disabled); transform:none; }
  .shake{ animation:shakeX .28s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shakeX{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
  .foot{ flex-shrink:0; padding-top:16px; position:relative; }

  /* ── 위 띠: ← + 묶음별 진행 막대(묶음 사이 간격이 더 넓다) + 장 수 ── */
  .top{ display:flex; align-items:center; gap:10px; height:38px; margin:-6px 0 6px; flex-shrink:0; position:relative; z-index:6; }
  .nav-arrow{ flex:0 0 auto; width:34px; height:34px; border:none; background:transparent; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; color:var(--g700); border-radius:8px; margin-left:-6px; transition:transform .12s; }
  .nav-arrow:active{ transform:scale(.9); }
  .nav-arrow svg{ width:22px; height:22px; }
  .segs{ flex:1; display:flex; gap:8px; }
  .segs .sg{ display:flex; gap:3px; }
  .segs i{ flex:1; height:4px; border-radius:2px; background:var(--g200); transition:background .25s; }
  .segs i.on{ background:var(--green); }
  .cnt{ flex:0 0 auto; font-size:13px; font-weight:600; color:var(--g600); min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }

  /* 묶음 뱃지 — 흰 카드 안이라 weak 면이 보인다(§4.15). 베이지 위에는 두지 않는다(유성 10-10) */
  .gchip{ display:inline-block; font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:99px; letter-spacing:-.2px; }
  .gchip.kid, .gchip.before{ background:var(--green100); color:var(--green-dark); }
  .gchip.parent{ background:var(--warn-weak-bg); color:var(--warn-weak-fg); }
  .gchip.teacher, .gchip.act{ background:var(--g100); color:var(--dark); }
  .gchip.adult{ background:var(--g100); color:var(--g700); }

  /* ── 그림 칸 — 최종 GPT 그림은 4:3 한 장. 지금은 대역이라 가운데 놓고 1.5배까지만 키운다 ── */
  .pic{ display:flex; align-items:center; justify-content:center; background:var(--cream); overflow:hidden; }
  .pic img{ display:block; max-width:100%; max-height:100%; object-fit:contain; }

  /* ── 글 ── */
  .ttl{ font-size:var(--fs-h1); font-weight:700; letter-spacing:-.5px; line-height:1.32; }
  .lines{ font-size:17px; color:var(--g700); line-height:1.6; letter-spacing:-.2px; }
  .lines p{ margin:0; } .lines p + p{ margin-top:6px; }
  .topic{ font-size:14px; font-weight:700; color:var(--g600); margin:12px 0 4px; }
  .stmt{ font-size:var(--fs-h2); font-weight:700; letter-spacing:-.4px; line-height:1.4; }
  .hint{ font-size:14px; font-weight:700; color:var(--green); margin:8px 0 0; }

  /* ── O/X — 흰 채움 + 그린틴트 2겹 그림자(유성 10-10, §4.9 「밝은 캔버스 위 옵션 = 흰 채움 + 그림자」) ── */
  .ox{ display:grid; grid-template-columns:1fr 1fr; gap:12px; flex-shrink:0; }
  .ox button{ height:84px; border:none; border-radius:var(--r-lg); background:#fff; color:var(--g800); box-shadow:var(--sh-btn); cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center; position:relative; transition:transform .1s, background .2s, color .2s, box-shadow .2s, opacity .2s; }
  .ox button:active{ transform:scale(.96); box-shadow:var(--sh1); }
  .ox button svg{ width:40px; height:40px; fill:none; stroke:currentColor; stroke-width:3.4; stroke-linecap:round; }
  .ox button.right{ background:var(--green500); color:var(--ink-on-dark); box-shadow:none; }
  .ox button.mine{ background:var(--g600); color:var(--ink-on-dark); box-shadow:none; }
  .ox button.dim{ opacity:.45; box-shadow:none; }
  .ox.answered button{ pointer-events:none; }
  .ox button .tag{ position:absolute; top:8px; right:11px; font-size:12.5px; font-weight:700; color:var(--ink-on-dark); }

  /* 답(카드 뒷면) */
  .res{ display:flex; align-items:center; gap:8px; font-size:24px; font-weight:700; letter-spacing:-.3px; margin:0 0 12px; color:var(--g900); }
  .res.ok{ color:var(--green-dark); }
  .res .rc{ width:30px; height:30px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .res .rc svg{ width:17px; height:17px; stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ansl p{ margin:0; font-size:17px; color:var(--g700); line-height:1.6; } .ansl p + p{ margin-top:6px; }

  /* ── 줄 목록 — 굵은 한 마디 + 한 줄(그림은 위 한 장, §3.5) ── */
  .rw{ padding:12px 0; border-top:1px solid var(--g100); }
  .rw:first-child{ border-top:none; padding-top:4px; }
  .rw b{ display:block; font-size:16.5px; font-weight:700; color:var(--g900); letter-spacing:-.3px; line-height:1.4; }
  .rw span{ display:block; font-size:15px; color:var(--g700); line-height:1.5; margin-top:2px; }
  .kv{ display:flex; gap:12px; align-items:baseline; font-size:14.5px; margin:2px 0 0; padding-top:12px; border-top:1px solid var(--g100); }
  .kv .k{ flex:0 0 auto; color:var(--g600); font-weight:600; } .kv .v{ color:var(--g800); font-weight:600; }

  /* ── 순서 줄(다치면) ── */
  .tl{ list-style:none; margin:0; padding:0; }
  .tl li{ display:flex; align-items:center; gap:14px; position:relative; padding:9px 0; }
  .tl li:not(:last-child)::before{ content:''; position:absolute; left:13px; top:calc(50% + 15px); height:calc(100% - 30px); width:2px; border-radius:1px; background:var(--green200); }
  .tl .num{ flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:var(--green); color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .tl .tx{ font-size:16.5px; font-weight:600; color:var(--g900); line-height:1.45; letter-spacing:-.3px; }

  /* ── 위기 전화 줄(14 Safety.html .tel-row 실코드) + 성인 칸 ── */
  .ab{ padding:14px 0; border-top:1px solid var(--g100); } .ab:first-child{ border-top:none; padding-top:2px; } .ab:last-child{ padding-bottom:2px; }
  .ab h3{ font-size:16.5px; font-weight:700; letter-spacing:-.3px; margin:0 0 4px; }
  .ab p{ margin:0; font-size:15px; color:var(--g700); line-height:1.6; }
  .tel-row{ display:flex; align-items:center; gap:10px; margin:10px 0 0; padding:11px 13px; border-radius:12px; background:var(--g50); text-decoration:none; color:inherit; transition:transform .12s; }
  .tel-row:active{ transform:scale(.98); }
  .tel-row + .tel-row{ margin-top:7px; }
  .tel-row .tn{ font-size:16px; font-weight:800; color:var(--green-dark); letter-spacing:-.2px; min-width:82px; }
  .tel-row .tl2{ font-size:13.5px; color:var(--g700); line-height:1.45; }

  /* ── 카드 덱 — 카드가 남은 높이를 다 채운다 + 뒤에 카드 두 장이 비친다 + 뒤집어서 답 ── */
  .stage{ flex:1; display:flex; flex-direction:column; position:relative; min-height:0; }
  .card{ display:flex; flex-direction:column; flex:1; }
  .dkwrap{ position:relative; flex:1; display:flex; flex-direction:column; }
  .dk{ position:relative; z-index:2; flex:1; display:flex; flex-direction:column; perspective:1400px; touch-action:pan-y; margin-bottom:18px; transition:transform .26s cubic-bezier(.22,.85,.25,1), opacity .26s; }
  .dk.drag{ transition:none; }
  .dk.rise{ animation:rise .34s cubic-bezier(.22,.85,.25,1) both; }
  @keyframes rise{ from{ transform:translateY(16px) scale(.955); opacity:.5; } to{ transform:none; opacity:1; } }
  .dk.fly{ transform:translateX(-125%) rotate(-9deg) !important; opacity:0; }
  /* 앞, 뒤 두 면을 같은 칸에 겹친다 → 카드 높이 = 둘 중 긴 쪽. 뒷면 설명이 길어도(작은 폰, 글자 키움, 가로) 잘리지 않는다 */
  .dk-in{ position:relative; flex:1; display:grid; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.3,.7,.25,1); }
  .dk.flip .dk-in{ transform:rotateY(180deg); }
  .face{ background:#fff; border-radius:22px; box-shadow:var(--sh2); overflow:hidden; display:flex; flex-direction:column; -webkit-backface-visibility:hidden; backface-visibility:hidden; }
  .face{ grid-area:1 / 1; }
  .face.back{ transform:rotateY(180deg); }
  .dk-pic{ flex:1 1 0; min-height:18svh; }   /* 남은 높이를 그림 칸이 다 가진다(상한 없음). 줄이 많은 장은 그림이 줄어 「다음」이 화면 안에 남게 — 바닥만 화면 높이 비례 */
  .dk-body{ padding:16px 20px 20px; flex-shrink:0; }
  .dk-body .ttl{ margin:12px 0 16px; }
  .face.back .dk-body{ flex:1; display:flex; flex-direction:column; padding:26px 24px; }
  .face.back .bmain{ margin:auto 0; }
  .flipnote{ padding-top:18px; font-size:13px; font-weight:600; color:var(--g500); text-align:center; }
  .peek{ position:absolute; z-index:1; left:14px; right:14px; bottom:9px; height:70px; background:#fff; border-radius:20px; opacity:.7; box-shadow:var(--sh1); }
  .peek.p2{ left:30px; right:30px; bottom:0; opacity:.42; z-index:0; }

  /* ── 표지 — 그림 = 포스터 앞면(유성 10-11) ── */
  /* 포스터 = 늘 통째로(유성 10-11 2차 「너무 커, 아래가 끊기지 않게」 — 1차의 폭 채우고 아래 흐리게 자르기는 폐기).
     크기 = 카드 폭의 72%(비율이라 화면 따라 같이 큼, 고정 px 상한 없음 — 1차 「max 걸지 말고」 유지).
     화면이 짧으면 칸이 줄어 포스터도 같이 준다 — 글, 버튼이 먼저. 화면이 길어 남는 높이는 글 칸이 가진다(아래 .cv-body).
     칸 = size 컨테이너(제 내용으로 카드를 키우지 않음 — 앞뒤 면 grid 겹침이 카드를 내용만큼 키우기 때문). 칸 높이 천장 = 포스터가 카드 폭 72%일 때 높이(카드 cqw 기준) */
  .face.cv{ container:card / inline-size; }
  .cv-art{ flex:1 1 0; min-height:26svh; max-height:calc(72cqw * 1009 / 720 + 32px); container:art / size; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--cream); }
  .cv-art img{ display:block; width:min(calc(100cqw - 32px), calc((100cqh - 32px) * 720 / 1009)); height:auto; border-radius:6px; box-shadow:0 1px 3px rgba(25,31,40,.10), 0 6px 18px rgba(25,31,40,.10); }
  .cv-body{ padding:20px 20px 0; }
  .face.cv > .cv-meta{ margin:auto 20px 0; padding:20px 0; }   /* 위 auto = 포스터 칸이 천장에 닿고 남은 높이만 글과 칸 사이로 */
  @supports not (width:1cqw){ .cv-art{ max-height:none; padding:16px; } .cv-art img{ width:auto; height:26svh; max-width:100%; } }   /* 아주 옛 브라우저만 */
  .cv-hi{ font-size:15px; font-weight:700; color:var(--green-dark); margin:0 0 6px; letter-spacing:-.2px; }
  .cv-t{ font-size:27px; font-weight:700; letter-spacing:-.6px; line-height:1.32; margin:0; }
  .cv-sub{ font-size:var(--fs-body); font-weight:400; color:var(--g700); line-height:1.6; letter-spacing:-.2px; margin:10px 0 0; }   /* §3.2 본문 + 굵기 사다리 400 = 부제 */
  .cv-meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cv-meta div{ border-radius:var(--r-md); padding:12px 14px; background:var(--green50); }
  .cv-meta b{ display:block; font-size:18px; font-weight:800; letter-spacing:-.3px; color:var(--g900); line-height:1.35; }
  .cv-meta span{ font-size:13.5px; color:var(--g600); font-weight:600; }

  /* ── 끝(열쇠 없을 때만) + 다 봤어요 ── */
  .intro-card{ background:#fff; border-radius:var(--r-lg); padding:26px 22px; box-shadow:var(--sh1); }
  .intro-card h1{ font-size:var(--fs-h1); font-weight:700; letter-spacing:-.5px; margin:0 0 20px; line-height:1.3; }
  .tfield{ margin-bottom:15px; }
  .tfield label{ display:block; font-size:12.5px; font-weight:600; color:var(--g600); margin:0 0 5px; transition:color .15s; }
  .tfield.focus label{ color:var(--green); }
  .tin-wrap{ position:relative; border-bottom:2px solid var(--g200); transition:border-color .15s; }
  .tfield.focus .tin-wrap{ border-color:var(--green); }
  .tin-wrap input{ width:100%; border:none; background:none; outline:none; font:inherit; line-height:1.5; font-size:18px; font-weight:600;
    color:var(--g900); padding:2px 34px 3px 0; caret-color:var(--green); letter-spacing:-.2px; }
  .tin-wrap .clr{ position:absolute; right:0; top:6px; width:15px; height:15px; border-radius:50%; background:var(--g300);
    border:none; display:none; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .tfield.has-val .clr{ display:flex; }
  .tin-wrap .clr svg{ width:7px; height:7px; color:#fff; display:block; }
  .tin-wrap input::placeholder{ color:var(--g500); font-weight:500; }

  function post(body, ms){

  function fmtBirth(v){ var d=String(v).replace(/\D/g,'').slice(0,8); var o=d.slice(0,4); if(d.length>4)o+='. '+d.slice(4,6); if(d.length>6)o+='. '+d.slice(6,8); return o; }

  // ── 토스트(§5.5) — 보이는 아래 버튼 위 12px. 폰 = 창 기준 / PC 목업(§3.8) = .wrap 기준 + 스크롤만큼 되돌림(14 toastBottom과 같은 프레임 판별) ──

    var b=document.querySelector('.scr.on .foot .btn, .scr.on > .btn');
    if(b && b.getClientRects().length){ var top=b.getBoundingClientRect().top - top0; if(top<frH) v=Math.min(Math.max(Math.round(frH-top)+12, 30), lim); }
    return (v - y)+'px';
  }
  function toast(m, ok, ms){
    var t=$('toast'); $('toastTx').textContent=m; $('toastCk').innerHTML=ok ? CHK : ''; $('toastCk').style.display=ok ? '' : 'none';
    t.style.bottom=toastBottom(t); t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, ms || 2800);
  }
  function pinOverlay(){ $('wrap').style.setProperty('--sy', (boxed() ? $('wrap').scrollTop : 0)+'px'); }

  // ── 아래에 더 있다(§4.13-6) — 넘치는 쪽(폰 = 창 / PC 목업 = .wrap)을 보고 아래 띠만 ──
  function paintFade(){
    var w=$('wrap'), bx=boxed(), sc=bx ? w : (document.scrollingElement || document.documentElement);
    var over=sc.scrollHeight-sc.clientHeight, y=sc.scrollTop;
    w.classList.toggle('more', over>6 && y<over-6);
    pinOverlay();
  }
  var fadeQ=0; function fadeSoon(){ if(fadeQ) return; fadeQ=requestAnimationFrame(function(){ fadeQ=0; paintFade(); }); }
  window.addEventListener('scroll', fadeSoon, { passive:true }); $('wrap').addEventListener('scroll', fadeSoon, { passive:true });
  window.addEventListener('resize', fadeSoon); $('wrap').addEventListener('load', fadeSoon, true);   // 그림이 늦게 와서 키가 바뀔 때
  if(window.MutationObserver) ['sCover','sMain','sEnd','sDone'].forEach(function(id){   // .wrap엔 안 건다(자기 .more 토글이 자기를 깨움)
    new MutationObserver(fadeSoon).observe($(id), { childList:true, subtree:true, attributes:true, attributeFilter:['class'] }); });

  // ── 뒤로(§4.11) — 가드 칸은 늘 1칸(23 설문 games/survey.js와 같은 꼴). 화면마다 ← 와 같은 한 단계 + 가드 다시 쌓기.
  //    표지, 다 봤어요 = 맨 끝 → 더블백(§4.11-4): 첫 뒤로 = 토스트 「한 번 더 뒤로 가면 나가요.」 2초, 가드는 다시 쌓지 않는다
  //    → 그 2초 안의 두 번째 뒤로는 아래가 비어 브라우저가 받아 나간다. 2초가 지나거나 그 사이 화면을 만지면 가드를 다시 쌓는다 ──
  function backStep(){
    if(onScr('sMain')) return function(){ go(-1); };
    if(onScr('sEnd')) return function(){ show('sMain'); render(-1); };   // 마지막 장으로
    return null;
  }
  var exitArmed=false, exitT=null;
  function pushGuard(){ history.pushState({ sf:1 }, ''); }
  function disarmExit(){ if(!exitArmed) return; exitArmed=false; clearTimeout(exitT); pushGuard(); }
  history.replaceState({ sf:0 }, ''); pushGuard();
  window.addEventListener('popstate', function(){
    if(busy){ pushGuard(); return; }   // 보내는 중엔 머문다
    var b=backStep(); if(b){ b(); pushGuard(); return; }
    exitArmed=true; toast('한 번 더 뒤로 가면 나가요.', true, 2000);
    clearTimeout(exitT); exitT=setTimeout(disarmExit, 2000);
  });
  document.addEventListener('pointerdown', disarmExit, true);
  $('dBack').innerHTML = BACK; $('endBack').innerHTML = BACK;
  $('dBack').addEventListener('click', function(){ var b=backStep(); if(b) b(); });
  $('endBack').addEventListener('click', function(){ var b=backStep(); if(b) b(); });

  // ── 누름(§5.3-1 물결) ──
  document.addEventListener('pointerdown', function(e){
    var btn=e.target.closest && e.target.closest('.btn'); if(!btn || btn.classList.contains('gate')) return;
    if(!btn.querySelector('.bl')){ var bl=document.createElement('span'); bl.className='bl'; while(btn.firstChild) bl.appendChild(btn.firstChild); btn.appendChild(bl); }
    var r=btn.getBoundingClientRect(), x=e.clientX-r.left;
    var rs=Math.ceil(Math.hypot(Math.max(x,r.width-x), r.height/2)/15)+1;
    var rip=document.createElement('span'); rip.className='rip'; rip.style.left=x+'px'; rip.style.top=(r.height/2)+'px'; rip.style.setProperty('--rs', rs);
    btn.appendChild(rip); requestAnimationFrame(function(){ rip.classList.add('go'); }); setTimeout(function(){ rip.remove(); }, 480);
  });

  // ── 표지 ──
  function showCover(){
    $('sCover').innerHTML = coverHtml();
    $('startBtn').addEventListener('click', function(){ show('sMain'); deck.i=-1; go(1); });
    show('sCover');
  }

  // ── 데모(?demo=1, 서버 없음) — 열쇠 아무거나 = 그 집(&mom=1 = 엄마 카드), 열쇠 「zzzzzzzzzzzz」 = 모르는 열쇠. 이름 칸은 홍길동 2021. 03. 15만 맞음 ──
  function demoPost(b){
    return new Promise(function(res){ setTimeout(function(){
      if(b.action==='safe_warm') return res({ ok:true });
      if(b.action==='safe_open') return res(b.k==='zzzzzzzzzzzz' ? { ok:false } : { ok:true, kind:FOR, mom:QS.get('mom')==='1' });
      if(b.k) return res(b.k==='zzzzzzzzzzzz' ? { ok:false, code:'nokey' } : { ok:true });
      var p=(b.people||[])[0]||{};
      if(p.name!=='홍길동' || String(p.birth).slice(-6)!=='210315') return res({ ok:false, code:'nomatch', message:'등록된 정보를 찾지 못했어요.\n이름과 생년월일을 다시 확인해 주세요.' });
      res({ ok:true });
    }, +(QS.get('lag')||700)); });
  }

  buildDeck(); applyFor(); showCover();
  if(KEY) post({ action:'safe_open', k:KEY }, 20000).then(applyOpen, function(){ /* 못 받아도 끝에서 safe_done이 다시 본다 */ });
  else warm();
  if(QS.get('at')){ show('sMain'); deck.i=Math.min(EC.length-1, Math.max(0, +QS.get('at')-1)); render(0); }   // 확인용: 바로 그 장
  paintFade();
</script>
</body>
</html>
