<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>반출납 — 생각공작소</title>
<meta name="robots" content="noindex">
<!-- 반출납(08). think-factory.kr/q → 08 GAS 웹앱을 *우리 도메인에서* iframe 임베드.
     ⓐ 새 라벨의 QR이 이 주소를 담는다(`/q?i=BK-202607-0001`) — 구글 배포 주소보다 짧아 QR 무늬가 성기고
        시스템을 어디로 옮겨도 이미 붙인 라벨이 안 죽는다.
     ⓑ 센터 벽 QR = `/q?ctr=주안` → 반납 화면.
        ⛔ `c`로 되돌리지 말 것: 구글 예약 파라미터라 c=0·c=1 외의 값은 GAS doGet에 닿지도 못하고
           "페이지를 찾을 수 없음"(404)이 된다(2026-07-30 실측 — 옛 `?c=주안`은 열리지 않는 주소였다).
     ⓒ 주소만 치고 들어오면 홈.
     쿼리는 그대로 GAS에 넘긴다(location.search 통째로) — 이동 대상이 바뀌면 아래 EXEC 한 줄만 교체.
     ⚠️ allow="camera" 필수 — 이 앱은 QR을 비추면 자동 인식한다(권한을 iframe에 위임하지 않으면 카메라가 안 켜짐). -->
<!-- 카톡 인앱 브라우저는 카메라(getUserMedia)가 막히는 사례가 보고됨 → 진입 즉시 기본 브라우저로.
     iframe 로드보다 먼저 head에서 실행. 기본 브라우저 UA엔 KAKAOTALK이 없어 재탈출 루프 없음. -->
<script>
  if (/KAKAOTALK/i.test(navigator.userAgent)) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  }
</script>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  html, body { height: 100%; margin: 0; background: #fff; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="app" title="반출납" allow="camera; clipboard-write"></iframe>
<script>
  var EXEC = "https://script.google.com/macros/s/AKfycbwd5AcT6yq7wF3L5MeWnJTJ9tf3Ra9Yi8HO2ncEtGHCUDFFH-OR2lAz7_TGVG-JYvg5/exec";

  /* 반납(벽 QR)만 구글 주소로 **넘겨준다** — 2026-07-31.
     왜: localStorage 는 *최상위 사이트*별로 파티션된다(07-31 실측). 붙어 있는 라벨 494장은
         script.google.com 으로 직접 열리는데, 벽 QR만 우리 도메인이라 **저장소가 갈려
         반납할 때 이름을 다시 고르게 된다.** 라벨은 다시 못 뽑으므로(유성 확정) 이쪽을 맞춘다.
     왜 인쇄물을 안 바꾸나: 벽 QR 4장은 이미 붙어 있다. 주소는 그대로 두고 여기서만 넘기면
         유성 노동이 0이고, 되돌리기도 이 블록 삭제 한 번이다.
     잃는 것이 없는 이유: ①회색 구글 배너는 **주 경로(옛 라벨)가 이미 겪는 것**이라 오히려 일치
         ②카톡 탈출은 *벽에 붙은 종이*엔 무의미(폰 기본 카메라로 찍는다)
         ③카메라 권한은 GAS sandboxFrame 이 `camera *` 를 위임하므로 안 잃는다(07-31 curl 실측).
     ⚠️ 미검증 1건: **최상위가 script.google.com 인 상태에서 카메라를 켜는 첫 사례**다.
         (옛 라벨 화면은 카메라를 안 쓴다) 안 열리면 이 블록만 지우면 원래대로 돌아온다.
     ⛔ 반출·연속 스캔(?scan=1 등)은 넘기지 않는다 — 그쪽은 라벨 화면이 ?who= 로 이름을 실어
        보내므로 이미 이어져 있고, 우리 도메인에 두어야 배너 없이 쓴다. */
  if (/[?&]action=return(&|$)/.test(location.search)) {
    location.replace(EXEC + location.search);
  } else {
    document.getElementById('app').src = EXEC + (location.search || "");
  }
</script>
</body>
</html>
