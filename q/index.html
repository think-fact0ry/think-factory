<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>반출납 — 생각공작소</title>
<meta name="robots" content="noindex">
<!-- 반출납(08). think-factory.kr/q → 08 GAS 웹앱을 *우리 도메인에서* iframe 임베드.
     ⓐ 새 라벨의 QR이 이 주소를 담는다(`/q?i=BK-202607-0001`) — 구글 배포 주소보다 짧아 QR 무늬가 성기고
        시스템을 어디로 옮겨도 이미 붙인 라벨이 안 죽는다.
     ⓑ 센터 벽 QR = `/q?ctr=주안` → 반납 화면.
        ⛔ `c`로 되돌리지 말 것: 구글 예약 파라미터라 c=0·c=1 외의 값은 GAS doGet에 닿지도 못하고
           "페이지를 찾을 수 없음"(404)이 된다(2026-07-30 실측 — 옛 `?c=주안`은 열리지 않는 주소였다).
     ⓒ 주소만 치고 들어오면 홈.
     쿼리는 그대로 GAS에 넘긴다(location.search 통째로) — 이동 대상이 바뀌면 아래 EXEC 한 줄만 교체.
     ⚠️ allow="camera" 필수 — 이 앱은 QR을 비추면 자동 인식한다(권한을 iframe에 위임하지 않으면 카메라가 안 켜짐). -->
<!-- 카톡 인앱 브라우저는 카메라(getUserMedia)가 막히는 사례가 보고됨 → 진입 즉시 기본 브라우저로.
     iframe 로드보다 먼저 head에서 실행. 기본 브라우저 UA엔 KAKAOTALK이 없어 재탈출 루프 없음. -->
<script>
  if (/KAKAOTALK/i.test(navigator.userAgent)) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  }
</script>
<link rel="apple-touch-icon" href="/assets/android-icon-192x192.png">
<style>
  html, body { height: 100%; margin: 0; background: #fff; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="app" title="반출납" allow="camera; clipboard-write"></iframe>
<script>
  var EXEC = "https://script.google.com/macros/s/AKfycbwd5AcT6yq7wF3L5MeWnJTJ9tf3Ra9Yi8HO2ncEtGHCUDFFH-OR2lAz7_TGVG-JYvg5/exec";

  /* 쿼리는 그대로 GAS에 넘긴다. ⛔ 벽 QR(action=return)을 구글 주소로 redirect했다가 되돌림(2026-08-01 유성:
     "gas script 주소로 이동되는데 X. think-fact~/q로 가야지" — 주소창에 구글 주소가 보이는 게 문제).
     저장소 통일은 리다이렉트가 아니라 진입 통일(라벨=문) 쪽으로 푼다 — 결정=docs/6 백로그 §📦. */
  document.getElementById("app").src = EXEC + (location.search || "");
</script>
</body>
</html>
