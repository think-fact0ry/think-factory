<!--
  think-factory.kr/selected — 06 선정 소식 알림톡 버튼 뒤 화면(바우처 결과를 알려 주는 보호자).
  ?a=yes&k=<열쇠> = 「선정됐어요 →」 / ?a=no&k=<열쇠> = 「선정되지 못했어요」 / ?k=<열쇠> = 대체문자(결과 다시 고르기부터).
  서버 = 06 웹앱 sel_get, sel_yes, sel_no, sel_wait, sel_nov(/continue와 같은 배포 — 새 배포 금지). 열쇠가 게이트라 틀린 열쇠는 어느 쪽인지 안 알려 준다.
  11-10 리허설 뒤(유성): 누르면 결과 화면이 바로(서버는 뒤에서, 차례대로 — 나중에 누른 것이 이김), 완료 화면마다 「← 잘못 눌렀어요」,
  새로고침 = 그 화면 그대로(히스토리 칸 + 보내던 누름은 sessionStorage), 뼈대 = 올 화면 마크업 그대로(글자만 회색 막대),
  파도 굵기는 가변 글꼴을 받은 뒤에만(못 받으면 색만 — 기본 글꼴은 굵기가 몇 단계뿐이라 다닥다닥 튄다). 이 판부터는 이 파일이 정본(프리뷰 7차, 8차는 그 전 판).
  11-10 2차(유성): 처음 뼈대 = 덩어리만, 끝 화면(done, nv) 「잘못 눌렀어요」 = 좌상단 ← + 글, 아래 = 사라지지 않는 토스트 「이제 창을 닫아도 돼요.」(체크 없음, 5번과 확인 화면은 부제 그대로),
  11-11(유성 「권장대로」, 원칙과 다른 시스템 대조 뒤): 초록 버튼 모서리 15, 뱃지와 표 머리 12, 확인 창 제목 21, 끝 화면 글 15 = docs/1 §3.2, §4.14 값. 뱃지 줄 높이(.who min-height)는 그대로라 제목 자리는 안 움직임.
  처음 들어온 화면이 등급, 결과 고르기면 두 번 밀어야 나감(docs/1 §4.11-4 — 다른 화면에서 넘어온 등급, 「선정되지 못했어요」는 뒤로 = 앞 화면).
  방문 통계 없음(주소에 열쇠가 있어서). 공개 레포라 아이 이름 0 — 화면 이름은 서버가 가려서 준다(김하○).
  설계 = 부모 레포 prototype/06_선정소식_제출화면_7차_프리뷰.html(3, 4, 5번, 확인 창, 완료 화면) + 06_선정소식_제출화면_8차_등급화면_프리뷰.html(등급 화면 = 나 + 글 1,
  서비스별 등급표) + 06_선정소식_원칙과다른곳_프리뷰.html(11-09 정함 12칸). CSS 값은 프리뷰 그대로 — ⚠️디자인을 고칠 땐 그 프리뷰와 같이.
  홍보지 = flyer-front.jpg, flyer-back.jpg(원본 1264x1772를 760 폭으로 줄인 판, 오감쑥쑥 집에만).
-->
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#f7f5f1;overscroll-behavior-y:none}
body{margin:0;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;background:#f7f5f1;color:#191f28;font-family:'Pretendard Variable',Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
#app{position:relative;flex:1 1 auto;min-height:0;width:100%;max-width:430px;margin:0 auto;overflow:hidden;background:#f7f5f1}

/* ===== 화면 (프리뷰 「우리 화면 = 가 프레임」 그대로 — 폰 틀의 위아래 막대 자리 80/46 대신 화면 끝까지) ===== */
.pg,.ov{position:absolute;inset:0;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;color:#191f28}
.pg{overflow:hidden;background:#f7f5f1;-webkit-user-select:none;user-select:none}
.scrn{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:#f7f5f1;scrollbar-width:none}
.scrn::-webkit-scrollbar{width:0}
.ov{pointer-events:none;z-index:20;overflow:hidden;-webkit-user-select:none;user-select:none}
.ov.live{pointer-events:auto}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(58,138,95,.55)}70%{box-shadow:0 0 0 7px rgba(58,138,95,0)}100%{box-shadow:0 0 0 0 rgba(58,138,95,0)}}
@keyframes ringIn{from{transform:scale(.7)}to{transform:none}}
@keyframes ckDraw{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
@keyframes slInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes slInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes slOutL{to{transform:translateX(-28%);opacity:0}}
@keyframes slOutR{to{transform:translateX(28%);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes illIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* 파도 한 바퀴 5.5초 = 한 줄 지나가는 1.5초(27.27%), 가운데 머묾 45~60%(12.27~16.36%), 나머지는 쉼
   굵기(amtLoopW)는 가변 글꼴(Pretendard Variable)을 받은 뒤에만(.wvw) — 받기 전 기본 글꼴은 굵기가 몇 단계뿐이라 글자가 다닥다닥 커졌다 작아진다(11-10 유성 리허설) */
@keyframes amtLoop{0%,27.27%,100%{color:#4e5968}12.27%,16.36%{color:#166841}}
@keyframes amtLoopW{0%,27.27%,100%{color:#4e5968;font-weight:400}12.27%,16.36%{color:#166841;font-weight:700}}
@keyframes chevLoop{0%,27.27%,100%{color:#8b95a1;stroke-width:2}12.27%,16.36%{color:#3a8a5f;stroke-width:3.2}}
@keyframes hlDraw{from{clip-path:inset(0 100% 0 0 round 2px)}to{clip-path:inset(0 0 0 0 round 2px)}}
.in1{animation:fu .4s ease backwards}
.in3{animation:fu .4s ease .26s backwards}
.in4{animation:fu .4s ease .36s backwards}

.ft{position:sticky;bottom:0;margin-top:auto;padding:12px 16px 24px;background:linear-gradient(to bottom,rgba(247,245,241,0),#f7f5f1 18px);display:flex;flex-direction:column;align-items:stretch;z-index:2}
.cta{position:relative;overflow:hidden;height:56px;border:0;border-radius:15px;background:#3a8a5f;color:#fff;font:600 17px 'Pretendard Variable',Pretendard,system-ui,sans-serif;cursor:pointer;transition:background .2s,transform .1s;display:flex;align-items:center;justify-content:center;width:100%}
.cta:active,.cta.press{transform:scale(.97);background:#166841}
.bl{position:relative;z-index:1;display:inline-flex;align-items:center;gap:4px}
.cta svg{width:19px;height:19px;flex:0 0 auto}
.ft.ftc{align-items:center;padding-top:8px}   /* 알약 하나만 있는 아래 줄(등급 화면, 완료 화면 「← 잘못 눌렀어요」) */
.rip{position:absolute;z-index:0;top:50%;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.16);transform:translate(-50%,-50%) scale(0);pointer-events:none}
.rip.go{transform:translate(-50%,-50%) scale(var(--rs,16));transition:transform .46s cubic-bezier(.25,.6,.3,1)}
.rip.fade{opacity:0;transition:opacity .3s}
.qlink{border:0;background:none;color:#6b7684;font:500 15px 'Pretendard Variable',Pretendard,system-ui,sans-serif;min-height:44px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:center;padding:0 10px;transition:transform .12s}
.qlink:active,.qlink.press{transform:scale(.93)}
.weak{height:52px;border:0;border-radius:14px;background:#f2f4f6;color:#4e5968;font:600 16px 'Pretendard Variable',Pretendard,system-ui,sans-serif;cursor:pointer;transition:background .15s}
.weak:active{background:#e5e8eb}
.nob{border:0;background:none;color:#6b7684;font:500 14.5px 'Pretendard Variable',Pretendard,system-ui,sans-serif;min-height:44px;cursor:pointer;align-self:center;padding:0 12px;transition:transform .12s}
.nob:active{transform:scale(.93)}
.chev{width:18px;height:18px;color:#8b95a1;flex:0 0 auto}
.eb3{font-size:13.5px;font-weight:600;color:#166841;margin:0 0 4px}
.card{margin:18px 16px 0;background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.03)}

/* 세로 칸 */
.tl{padding:20px 20px 4px}
.st{display:grid;grid-template-columns:24px 1fr;column-gap:14px;position:relative;padding-bottom:18px}
.nd{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #d1d6db;background:#fff;transition:background-color .3s,border-color .3s,border-width .3s;position:relative;z-index:1}
.nd .dot{display:none;width:8px;height:8px;border-radius:50%;background:#3a8a5f}
.nd svg{display:none;width:13px;height:13px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.nd svg path{stroke-dasharray:22}
.st.sd .nd{background:#3a8a5f;border-color:#3a8a5f}
.st.sd .nd .ck{display:block}
.st.nt .nd{background:#b0b8c1;border-color:#b0b8c1}
.st.nt .nd .ds{display:block}
.st.cur .nd{border:3px solid #3a8a5f}
.st.cur .nd .dot{display:block}
.st .tx b{display:block;font-size:16px;font-weight:600;color:#191f28;line-height:24px;transition:color .3s;transform-origin:left center;animation:illIn .32s cubic-bezier(.34,1.56,.64,1) var(--td,0s) backwards}   /* 11-09 유성: 흰 박스 글자 먼저 하나씩(4번과 같은 등장), 왼쪽 동그라미는 이어서 */
.scrn.in-r .st .tx b,.scrn.in-l .st .tx b{animation-delay:calc(var(--td,0s) + .38s)}
.st.td .tx b{color:#6b7684;font-weight:500}
.st.cur .tx b{color:#166841}
.ln{position:absolute;left:11px;top:28px;bottom:4px;width:2px;border-radius:1px;background:#e5e8eb;overflow:hidden;transform-origin:top}
.lf{position:absolute;inset:0;background:#3a8a5f;transform-origin:top;transition:transform .42s cubic-bezier(.22,.85,.25,1)}
.ln .lf.off,.ln .lf.pre{transform:scaleY(0)}
/* 한 칸 나아감(모션 3)의 「전」 모양 */
.st.nt.pre .nd{background:#fff;border:3px solid #3a8a5f}
.st.nt.pre .nd .ds{display:none}
.st.nt.pre .nd .dot{display:block}
.st.nt.pre .tx b{color:#166841}
.st.cur.pre .nd{border:2px solid #d1d6db}
.st.cur.pre .nd .dot{display:none}
.st.cur.pre .tx b{color:#6b7684;font-weight:500}
.st.nt.chg .nd .ds path{animation:ckDraw .3s ease .08s backwards}
.st.cur.arr .nd{animation:ringIn .3s cubic-bezier(.34,1.56,.64,1),ring 1.8s ease-out .3s infinite}   /* 지금 칸 = 계속 퍼짐(11-10 유성 — 3번 화면이 한 번만 퍼졌다) */
.st.cur.arr .nd .dot{animation:pop .3s ease-out .08s backwards}
/* 가로 세 칸 (4번 화면) */
.trk{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 22px 4px;position:relative}
.tln{position:absolute;left:16.6%;right:16.6%;top:9px;height:2px;background:#e5e8eb}
.tn{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12.5px;color:#6b7684;transition:color .3s}
.tn i{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #d1d6db;display:flex;align-items:center;justify-content:center;transition:border-color .3s,border-width .3s}
.tn i svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.tn i b{width:6px;height:6px;border-radius:50%;background:#3a8a5f}
.tn.sd i{background:#3a8a5f;border-color:#3a8a5f}
.tn.cur{color:#166841;font-weight:600}
.tn.cur i{border:3px solid #3a8a5f}
.tn.cur.pre{color:#6b7684;font-weight:400}
.tn.cur.pre i{border:2px solid #d1d6db}
.tn.cur.pre i b{display:none}
.tn.cur.arr i{animation:ringIn .3s cubic-bezier(.34,1.56,.64,1),ring 1.8s ease-out .3s 1}
/* 4번 화면 줄 = 글 왼쪽, 그림 오른쪽(› 자리). 고르면 체크팝 후 넘어감 (§4.9, 06 _confirmSelect_ 복제) */
.lst3{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.r3{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;min-height:82px;padding:12px 14px 12px 18px;border:0;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.03);font-family:inherit;text-align:left;cursor:pointer;transition:transform .08s}
.r3:active{transform:scale(.96)}
.r3 span.t{flex:1;min-width:0}
.r3 b{display:block;font-size:17px;font-weight:600;color:#191f28}
.r3 em{display:block;font-style:normal;font-size:13.5px;color:#6b7684;margin-top:3px}
.r3 .ill{flex:0 0 auto;width:50px;height:50px;display:block;animation:illIn .32s cubic-bezier(.34,1.56,.64,1) var(--id,0s) backwards}
/* 11-09 유성: 그림만 말고 버튼 안 글자도 같은 등장(글자는 왼쪽 기준으로 커짐) */
.r3 .t b,.r3 .t em{transform-origin:left center;animation:illIn .32s cubic-bezier(.34,1.56,.64,1) var(--id,0s) backwards}
.scrn.in-r .r3 .ill,.scrn.in-l .r3 .ill,.scrn.in-r .r3 .t b,.scrn.in-l .r3 .t b,.scrn.in-r .r3 .t em,.scrn.in-l .r3 .t em{animation-delay:calc(var(--id,0s) + .38s)}
.r3 .ill svg{width:100%;height:100%;display:block}
.card-chk{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.5);opacity:0;pointer-events:none;transition:opacity .1s}
.confirming .card-chk{opacity:1}
.card-chk b{width:34px;height:34px;border-radius:50%;background:#3a8a5f;display:flex;align-items:center;justify-content:center;transform:scale(0)}
.confirming .card-chk b{animation:cardcpop .3s cubic-bezier(.34,1.56,.64,1) forwards}
.card-chk svg{width:18px;height:18px;stroke-dasharray:22;stroke-dashoffset:22}
.confirming .card-chk svg{animation:cardcdraw .25s .12s ease forwards}
@keyframes cardcpop{to{transform:scale(1)}}
@keyframes cardcdraw{to{stroke-dashoffset:0}}

/* ===== 모션 (화면마다 정함) ===== */
/* 1 블록 등장 = 5번 화면 */
.m1 .b1{animation:fu .4s ease backwards}
.m1 .b2{animation:fu .4s ease .26s backwards}
.m1 .b3{animation:fu .4s ease .36s backwards}
.m1 .st.cur.arr .nd{animation:ringIn .3s cubic-bezier(.34,1.56,.64,1),ring 1.8s ease-out .3s infinite}
/* 3 한 칸 나아감 = 3번, 4번, 등급 화면 (지난 칸이 바뀌고, 선이 차고, 다음 칸이 켜짐 + 화면은 옆으로 밀림) */
.m3 .b1,.m3 .b2,.m3 .b3{animation:fu .3s ease backwards}
.m3.in-r .b1,.m3.in-r .b2,.m3.in-r .b3,.m3.in-l .b1,.m3.in-l .b2,.m3.in-l .b3{animation:none}
.scrn.in-r{animation:slInR .36s cubic-bezier(.22,.85,.25,1) backwards}
.scrn.in-l{animation:slInL .36s cubic-bezier(.22,.85,.25,1) backwards}
.scrn.out-l{animation:slOutL .36s cubic-bezier(.22,.85,.25,1) forwards;pointer-events:none}
.scrn.out-r{animation:slOutR .36s cubic-bezier(.22,.85,.25,1) forwards;pointer-events:none}

/* ===== 등급 고르기 + 확인 창 + 알려준 뒤 ===== */
.hd{padding:22px 22px 0}
/* 11-09 유성 「기준을 등으로」: 머리 줄 높이 = 뱃지 높이 24.75(12.5 × 1.5 + 위아래 3), 뱃지 없는 3번(「알려주셔서 감사해요」)도 같은 줄에 넣어 제목 자리가 58.75로 같다 */
.who{display:flex;align-items:center;gap:8px;margin:0 0 12px;min-height:24.75px}
.who .eb3{font-size:13.5px;font-weight:600;color:#166841;margin:0}
.who .bdg{font-size:12px;font-weight:600;color:#ffffff;background:#3a8a5f;border-radius:999px;padding:3px 10px;line-height:1.5}   /* 유성 11-09 = 원칙 §4.15 fill. 이 화면은 늘 밝은 판이라 hex */
.who span{font-size:13.5px;color:#4e5968}
.q{font-size:24px;line-height:1.36;font-weight:700;letter-spacing:-.5px;margin:0}
.qs{font-size:15px;color:#6b7684;margin:8px 0 0;line-height:1.5}
.lst{padding:16px 16px 4px;display:flex;flex-direction:column;gap:8px}
.lh{display:flex;justify-content:space-between;padding:0 46px 0 16px;font-size:12px;color:#6b7684;margin:0 0 -2px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:9px 18px 9px 16px;border:0;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.03);font-family:inherit;color:#191f28;cursor:pointer;text-align:left;transition:transform .08s}
.row:active,.row.press{transform:scale(.96)}
.gl{flex:1;min-width:0;font-size:17px;font-weight:500;letter-spacing:-.2px}
.am3{font-size:15px;color:#4e5968;font-variant-numeric:tabular-nums;white-space:nowrap}
/* › 물결 = 위에서부터 하나씩 초록 굵게 (유성 11-07). 11-09 「월 본인부담금액에도 … 폰트웨이트 + 그린컬러」, 「딜레이 추가하여 계속 반복」. 창이 열려 있는 동안은 끔 */
.lst.wave .row .chev{animation:chevLoop 5.5s ease-in-out calc(var(--i) * .5s) infinite backwards}
.lst.wave .row .am3{animation:amtLoop 5.5s ease-in-out calc(var(--i) * .5s) infinite backwards}
.lst.wave.wvw .row .am3{animation-name:amtLoopW}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .22s}
.dim.on{opacity:1}
.bs{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border-radius:24px;padding:10px 20px 12px;transform:translateY(calc(100% + 16px));transition:transform .32s cubic-bezier(.2,.8,.2,1);touch-action:none}
.bs.on{transform:none}
.bs.grab{transition:none}
.bs.press{scale:.97;transition:scale .12s}

  // ── 두 번 밀어 나가기(docs/1 §4.11-4, 11-10 유성 2차 「몇등급으로 선정되셨나요 페이지에서 스와이프 두번 … 바우처 결과를 다시 골라주세요 에도」)
  //    처음 들어온 화면(d = 0)이 등급 화면, 결과 고르기 화면이면 그 칸 위에 가드 1칸. 첫 뒤로 = 가드가 걷히고 안내 2초만(가드를 다시 쌓지 않음 —
  //    그래야 두 번째 뒤로를 브라우저가 받아 나간다), 2초 뒤나 화면을 만지면 가드를 다시 쌓는다.
  //    다른 화면에서 넘어온 등급, 「선정되지 못했어요」 화면(d > 0)은 가드 없이 뒤로 = 앞 화면(「바우처 결과를 다시 골라주세요를 들렀다가 … 그 페이지로 와야겠지」)
  var G = { on: false, armed: false, t: 0 };   // on = 가드 칸 위에 있음(그 위에 창 칸이 열려 있어도), armed = 안내가 떠 있는 2초
  function guardSync() {
    if (G.on || G.armed || S.d !== 0 || !EXIT[S.step]) return;
    try { history.pushState({ tf: 'guard', step: S.step, d: 0 }, ''); G.on = true; } catch (_) {}
  }
  function disarm() { clearTimeout(G.t); if (!G.armed) return; G.armed = false; tstHide(); guardSync(); }
  document.addEventListener('pointerdown', function () { if (G.armed) disarm(); }, true);
  window.addEventListener('popstate', function (e) {
    if (skipPop > 0) { skipPop--; return; }
    if (hLayer) { hLayer = false; closeOv(); return; }
    var st = e.state;
    // 가드가 걷힌 첫 뒤로(가드 바로 아래 = 처음 화면 칸) = 화면은 그대로, 안내만
    if (G.on && st && st.tf === 'scr' && !(st.d > 0)) {
      G.on = false;
      try { history.replaceState({ tf: 'scr', step: S.step, d: 0 }, ''); } catch (_) {}
      if (!EXIT[S.step]) { try { history.back(); } catch (_) {} return; }   // 가드 위 화면이 나가는 화면이 아니게 바뀐 드문 경우 = 한 번에 나감
      G.armed = true; tst(EXIT[S.step] + '\n' + EXIT2, true, 2000);
      clearTimeout(G.t); G.t = setTimeout(disarm, 2000);
      return;
    }
    if (!st || (st.tf !== 'scr' && st.tf !== 'guard') || !STEPS[st.step]) return;
    G.on = st.tf === 'guard';
    S.d = st.d || 0;
    var step = st.step;
    if (step === 'fail' && !S.pending) step = 'choice';
    if (step === 'grade' && noGrade()) step = 'choice';
    S.step = step; render('back');
    guardSync();
  });
  // ── 토스트(docs/1 §5.5). ms 0 = 사라지지 않음(끝 화면). 화면 아래 고정 줄(.ft)이 있으면 그 위 12px(§5.5 「하단 버튼을 가리지 않게」)
  var tstEl = document.getElementById('tst'), tstM = tstEl.querySelector('.tm'), tstT = 0;
  function tst(msg, ok, ms) {
    clearTimeout(tstT);
    var sc = curScrn(), f = sc && sc.querySelector('.ft > *'), b = '';
    if (f) { var r = f.getBoundingClientRect(); if (r.height) b = Math.round(app.getBoundingClientRect().bottom - r.top + 12) + 'px'; }
    tstEl.style.bottom = b;
    tstM.textContent = msg; tstEl.classList.toggle('okk', !!ok); tstEl.classList.add('on');
    if (ms) tstT = setTimeout(tstHide, ms);
  }
  function tstHide() { clearTimeout(tstT); tstEl.classList.remove('on'); }
  // 「← 잘못 눌렀어요」 = 앞 화면. 아직 안 보낸 다음 누름은 버리고(보내는 중인 것은 서버에 닿는다 — 다시 고르면 그 값이 이긴다), 새로고침 때 다시 보낼 기록도 지운다
  function parentOf(step) { return step === 'done' ? (noGrade() ? 'choice' : 'grade') : step === 'nv' ? 'no' : 'choice'; }
  function undo() {
    Q.next = null; ssClear();
    if (S.d > 0) { try { history.back(); return; } catch (_) {} }
    nav(parentOf(S.step), 'back', true);
  }

  // ── 창, 모달, 로더
  function liftSheet() {
    ov.classList.add('live'); layerIn();
    requestAnimationFrame(function () { requestAnimationFrame(function () { ov.querySelector('.dim').classList.add('on'); ov.querySelector('.bs,.cmodal').classList.add('on'); odSync(); }); });
  }
  function openSheet(g) {
    waveOff();
    S.g = String(g);
    var T = GRADES[S.info.svc];
    var rows = '<div><span>' + T.head + '</span><b class="hl">' + won(T.amt[g]) + '</b></div>' + (T.gov ? '<div><span>월 정부지원금</span><span class="v">' + won(T.gov[g]) + '</span></div>' : '');
    ov.innerHTML = '<div class="dim" data-act="close"></div><div class="bs" role="dialog" aria-modal="true" aria-label="등급 확인"><div class="hdl"></div>' + WHO() + '<h4>' + g + '등급이 맞을까요?</h4><p class="bsub">통지서의 금액과 같은지 확인해주세요.</p><div class="rcpt">' + rows + '</div><div class="btns"><button type="button" class="cta" data-act="submit">' + g + '등급으로 알려주기</button><button type="button" class="weak" data-act="close">다시 고르기</button></div></div>';
    liftSheet();
  }
  // 「아직 몰라요」 → 가운데 모달(§4.4) = 게이트. 왼쪽 「닫기」 = 창만 닫음(옛 「아니요」 = 5번 — 11-10 유성: 등급 화면 아래 「선정 문자를 못 받았어요」가 이미 그 길),
  // 「네, 받았어요」 = 바로 신청된 걸로(등급 모름, 유성 11-09)
  function openGate() {
    waveOff();
    ov.innerHTML = '<div class="dim" data-act="close"></div><div class="cmodal" role="alertdialog" aria-modal="true" aria-label="선정 문자 확인"><h3>선정 문자는 받으셨나요?</h3><p>등급은 계약할 때 확인해 드릴게요 ☺️</p><div class="row2"><button type="button" class="cm-btn" data-act="close">닫기</button><button type="button" class="cm-btn primary" data-act="gateYes">네, 받았어요</button></div></div>';

  function openNvSheet() {

    liftSheet();
  }
  function zoom(p) {
    ov.innerHTML = '<div class="zm"><button type="button" class="zx" data-act="close" aria-label="닫기">' + SV.x + '</button><img src="' + IMG[p] + '" alt="홍보지 ' + (p === 'L' ? '앞면' : '뒷면') + '" draggable="false"><div class="zn"><button type="button" data-act="zoom" data-p="L" class="' + (p === 'L' ? 'on' : '') + '">앞면</button><button type="button" data-act="zoom" data-p="R" class="' + (p === 'R' ? 'on' : '') + '">뒷면</button></div></div>';
    ov.classList.add('live'); layerIn(); odSync();
  }
  function closeOv(now) {
    if (!ov.innerHTML) return;
    if (now) { ov.innerHTML = ''; ov.classList.remove('live'); odSync(); return; }
    if (S.step === 'grade' && !RM) {
      var l = curScrn() && curScrn().querySelector('.lst');
      if (l) { if (FONT.done) waveOn(l); else whenFont(function () { if (l.isConnected && !ov.classList.contains('live')) waveOn(l); }); }
    }
    var dim = ov.querySelector('.dim'), bs = ov.querySelector('.bs,.cmodal');
    if (dim) dim.classList.remove('on');
    if (bs) { bs.classList.remove('on', 'grab', 'press'); bs.style.transform = ''; }
    if (ov.querySelector('.zm')) ov.innerHTML = '';
    ov.classList.remove('live'); odSync();
    setTimeout(function () { if (!ov.classList.contains('live')) ov.innerHTML = ''; }, 330);

  function userClose() { closeOv(); layerDrop(); }

  // ── 글꼴: 파도의 굵기는 Pretendard Variable(가변 — 굵기가 이어서 변함)을 받은 뒤에만. 4초 안에 못 받으면 색만 움직인다
  var FONT = { ok: false, done: false, cbs: [] };
  function whenFont(f) { if (FONT.done) f(); else FONT.cbs.push(f); }
  (function () {
    function fin(ok) { if (FONT.done) return; FONT.done = true; FONT.ok = !!ok; FONT.cbs.splice(0).forEach(function (f) { f(); }); }
    var F = '15px "Pretendard Variable"', TX = '0123456789,원';
    try {
      if (!document.fonts || !document.fonts.load) { fin(false); return; }
      // load()가 돌려준 글꼴이 하나도 없으면(글꼴 CSS를 못 받음) check()는 그래도 참이라 믿지 않는다
      Promise.all([document.fonts.load('400 ' + F, TX), document.fonts.load('700 ' + F, TX)]).then(function (r) {
        var faces = r[0].concat(r[1]);
        fin(faces.length > 0 && faces.every(function (f) { return f.status === 'loaded'; }));
      }, function () { fin(false); });
      setTimeout(function () { fin(false); }, 4000);
    } catch (_) { fin(false); }
  })();

  // ── 서버(06 웹앱). 읽기 3번, 쓰기 2번(서버 쓰기는 같은 값이면 그대로라 한 번 더 보내도 됨). busy, error = 다시
  //    keep = 쓰기 — 화면을 닫거나 「활동사진 보러가기」로 떠나도 요청은 끝까지 간다(keepalive)
  function call06(action, tries, extra, keep) {
    return new Promise(function (res, rej) {
      var left = tries;
      (function one() {
        var ac = window.AbortController ? new AbortController() : null, t = ac ? setTimeout(function () { ac.abort(); }, 15000) : 0;
        fetch(GAS06 + '?action=' + action + '&k=' + encodeURIComponent(KEY) + (extra || ''), { signal: ac ? ac.signal : undefined, cache: 'no-store', keepalive: !!keep })
          .then(function (r) { return r.text(); })
          .then(function (tx) { clearTimeout(t); var j = JSON.parse(tx); if (!j || j.busy || j.error || j.bad) throw 0; res(j); })
          .catch(function () { clearTimeout(t); if (--left > 0) setTimeout(one, 900); else rej(); });
      })();
    });
  }
  function setInfo(r) {
    ['svc', 'who', 'st', 'g', 'again'].forEach(function (k) { if (r && r[k] !== undefined) S.info[k] = r[k]; });
    if (S.info.svc === '오감' && !setInfo.pre) { setInfo.pre = 1; setTimeout(function () { [IMG.L, IMG.R].forEach(function (u) { var i = new Image(); i.src = u; }); }, 800); }
  }
  function showBad() { S.timers.forEach(clearTimeout); closeOv(true); tstHide(); pg.innerHTML = ''; app.classList.add('isbad'); }
  var ACT = { yes: 'sel_yes', no: 'sel_no', wait: 'sel_wait', nov: 'sel_nov' };
  // 「선정되지 못했어요」 = 서버 st로 갈림: check(선생님이 이미 정해짐), nov(이미 바우처 없이 신청 — 서버가 그대로 둠), 그 밖 3번
  function noStep(r) { return r.st === 'check' ? 'check' : r.st === 'nov' ? 'nv' : 'no'; }
  function resultStep(kind, r) { return kind === 'yes' ? 'done' : kind === 'nov' ? 'nv' : kind === 'wait' ? 'wait' : noStep(r); }
  // 응답만 놓친 경우(작업은 됨)를 가르려고 실패 뒤 한 번 지금 상태를 묻는다
  function landed(kind, g, r) {
    var want = { yes: ['yes'], no: ['no', 'check', 'nov'], wait: ['wait'], nov: ['nov'] }[kind];
    return want.indexOf(r.st) >= 0 && (kind !== 'yes' || String(r.g == null ? '' : r.g) === String(g));
  }
  // ── 누름 = 결과 화면을 바로 그리고(낙관, 11-10 유성 「모든 버튼을 로딩 없이」), 서버엔 뒤에서 차례대로 보낸다.
  //    Q.cur = 보내는 중 하나, Q.next = 그 뒤에 누른 것 중 마지막 하나(중간 것은 버림 — 서버엔 마지막 누름만 남으면 된다. 1등급 → 잘못 눌렀어요 → 3등급 = 3등급).
  //    끝내 못 보냈고 그 결과 화면을 아직 보고 있으면 = 실패 화면(다시 보내기). 다른 답을 고르는 중이면 조용히(그 답이 보낸다).
  //    보내던 누름은 sessionStorage에도(새로고침하면 서버를 보고 안 닿았으면 다시 보냄 — 같은 값이면 서버가 그대로라 두 번 보내도 됨)
  var Q = { cur: null, next: null }, SSK = 'tf_sel_last';
  function ssSet(w) { try { sessionStorage.setItem(SSK, JSON.stringify({ k: KEY, kind: w.kind, g: w.g, step: w.step, at: Date.now() })); } catch (_) {} }
  function ssGet() { try { var o = JSON.parse(sessionStorage.getItem(SSK) || 'null'); return o && o.k === KEY && ACT[o.kind] && STEPS[o.step] && Date.now() - o.at < 600000 ? o : null; } catch (_) { return null; } }
  function ssClear() { try { sessionStorage.removeItem(SSK); } catch (_) {} }
  function want(kind, g, step) {
    var w = { kind: kind, g: g == null ? '' : String(g), step: step };
    S.pending = null; ssSet(w);
    if (Q.cur) Q.next = w; else run(w);
  }
  function run(w) {
    Q.cur = w;
    call06(ACT[w.kind], 2, w.kind === 'yes' ? '&g=' + encodeURIComponent(w.g) : '', true).then(function (r) { fin(w, r); }, function () {
      // 응답만 놓친 경우(작업은 됨)를 가르려고 지금 상태를 한 번 묻는다
      call06('sel_get', 1).then(function (r) { fin(w, r.none || landed(w.kind, w.g, r) ? r : null); }, function () { fin(w, null); });
    });
  }
  function fin(w, r) {
    Q.cur = null;
    if (r && r.none) { Q.next = null; ssClear(); showBad(); return; }
    if (r) setInfo(r);
    if (Q.next) { var n = Q.next; Q.next = null; run(n); return; }   // 더 나중에 누른 것이 이긴다
    if (!r) {
      if (S.step === w.step) { S.pending = w; nav('fail', 'none', true); }
      else ssClear();
      return;
    }
    ssClear();
    var real = resultStep(w.kind, r);   // 「선정되지 못했어요」인데 선생님이 이미 정해짐(check) 또는 이미 바우처 없이 신청(nv) = 그 화면으로 바꿔 그림
    if (S.step === w.step && real !== w.step) nav(real, 'none', true);
  }
  // 누른 결과 화면 = 서버 답을 안 기다리고 바로
  function press(kind, g, step) { want(kind, g, step); nav(step, 'fwd'); }
  function noGuess() { return S.info.st === 'nov' ? 'nv' : 'no'; }   // 서버도 바우처 없이 뒤 「안 됨」은 그대로 둔다(nov)

  // ── 처음: 열쇠 확인(sel_get). a=no = 누른 것을 바로 보냄(sel_no, 같이 보냄 — 기다림 한 번)
  //    새로고침(이 칸에 step이 있음) = 그 화면 그대로(서버 상태와 맞는 것만 — restore). 「선정되지 못했어요」도 다시 안 보낸다(그사이 다른 답을 골랐을 수 있다)
  //    ⚠️새로고침인지는 history.state만으로 가르지 않는다 — 크롬은 같은 주소로 새로 열어도(알림톡 링크를 같은 탭에서 다시) 그 칸의 상태를 넘겨준다.
  //      그걸 새로고침으로 보면 「선정되지 못했어요」를 다시 눌러도 안 보낸다. 그래서 들어온 방식이 reload, back_forward일 때만
  var NT = (function () { try { return performance.getEntriesByType('navigation')[0].type || ''; } catch (_) { return ''; } })();
  function boot() {
    var hs0 = NT === 'reload' || NT === 'back_forward' ? history.state : null;
    var hs = hs0 && (hs0.tf === 'scr' || hs0.tf === 'layer' || hs0.tf === 'guard') && STEPS[hs0.step] && hs0.step !== 'lfail' ? hs0.step : '';
    G.on = !!(hs0 && hs0.tf === 'guard');   // 가드 칸에서 새로고침 = 그 칸을 그대로 가드로(또 쌓지 않음)
    var pend = hs ? ssGet() : null;
    if (!hs) ssClear();
    if (hs === 'fail' && !pend) hs = '';   // 실패 화면에서 새로고침 = 보내던 것이 없으면 처음처럼
    S.d = hs ? (hs0.d || 0) : 0;
    S.pending = null; S.step = 'loading';
    S.skel = hs && hs !== 'fail' ? hs : hs === 'fail' ? pend.step : A === 'yes' ? 'grade' : A === 'no' ? 'no' : 'choice';
    render('none');
    if (!KEY) { showBad(); return; }
    var get = call06('sel_get', 3);
    if (A === 'no' && !hs) {
      var w = call06('sel_no', 2, '', true).then(function (r) { return { r: r }; }, function () { return { r: null }; });
      get.then(function (r) {
        if (r.none) { showBad(); return; }
        setInfo(r);
        w.then(function (x) {
          if (x.r && x.r.none) { showBad(); return; }
          if (x.r) { setInfo(x.r); nav(noStep(x.r), 'none'); }
          else { S.pending = { kind: 'no', g: '', step: 'no' }; nav('fail', 'none'); }
        });
      }).catch(function () { nav('lfail', 'none'); });
      return;
    }
    get.then(function (r) {
      if (r.none) { showBad(); return; }
      setInfo(r);
      if (hs) { restore(hs, r, pend); return; }
      if (A === 'yes') { if (noGrade()) { want('yes', '', 'done'); nav('done', 'none'); } else nav('grade', 'none'); }
      else nav('choice', 'none');
    }).catch(function () { nav('lfail', 'none'); });
  }
  // 새로고침한 화면 = 서버가 그 화면과 맞을 때만 그대로, 아니면 앞 화면. 보내다 끊긴 누름(10분 안)이 서버에 안 닿았으면 다시 보내고 그 결과 화면
  function restore(hs, r, pend) {
    if (hs === 'fail') hs = pend.step;
    if (pend) {
      if (!landed(pend.kind, pend.g, r)) {
        want(pend.kind, pend.g, pend.step);
        nav(pend.step, 'none'); return;
      }
      ssClear();
    }
    var st = r.st, gr = noGrade() ? 'choice' : 'grade', s = 'choice';
    if (hs === 'grade') s = gr;
    else if (hs === 'done') s = st === 'yes' ? 'done' : gr;
    else if (hs === 'no') s = st === 'check' ? 'check' : (st === 'no' || st === 'nov') ? 'no' : 'choice';
    else if (hs === 'nv') s = st === 'nov' ? 'nv' : st === 'no' ? 'no' : st === 'check' ? 'check' : 'choice';
    else if (hs === 'check') s = st === 'check' ? 'check' : 'choice';
    else if (hs === 'wait') s = st === 'wait' ? 'wait' : 'choice';
    nav(s, 'none');
  }

  // ── 누르기
  // 4번 화면 줄 = 체크팝 후 0.6초(§4.9)
  function pickRow(el) {
    if (S.busy) return; S.busy = true;
    var ck = document.createElement('span'); ck.className = 'card-chk'; ck.innerHTML = '<b>' + SV.pick + '</b>';
    el.appendChild(ck);
    requestAnimationFrame(function () { el.classList.add('confirming'); });
    S.timers.push(setTimeout(function () {
      S.busy = false;
      var v = el.dataset.v;
      if (v === 'yes') { if (noGrade()) press('yes', '', 'done'); else nav('grade', 'fwd'); }
      else if (v === 'no') press('no', '', noGuess());
      else press('wait', '', 'wait');
    }, 600));
  }
  function act(a, el) {
    if (a === 'pick') { pickRow(el); return; }
    if (a === 'open') { hold(el, function () { openSheet(el.dataset.g); }); return; }
    if (a === 'close') { userClose(); return; }
    if (a === 'submit') { press('yes', S.g, 'done'); return; }
    if (a === 'nvsheet') { hold(el, openNvSheet); return; }
    if (a === 'nvok') { press('nov', '', 'nv'); return; }
    if (a === 'gate') { hold(el, openGate); return; }
    if (a === 'gateYes') { press('yes', 'u', 'done'); return; }
    if (a === 'undo') { hold(el, undo); return; }
    if (a === 'redo' || a === 'back') { hold(el, function () { nav('choice', 'back'); }); return; }
    if (a === 'more') { var href = el.getAttribute('href'); hold(el, function () { location.href = href; }); return; }
    if (a === 'zoom') { zoom(el.dataset.p); return; }
    if (a === 'retry') { var p = S.pending; if (p) { want(p.kind, p.g, p.step); nav(p.step, 'fwd'); } return; }
    if (a === 'reload') { boot(); return; }
  }
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || !app.contains(el)) return;
    if (el.tagName === 'A') e.preventDefault();
    act(el.dataset.act, el);
  });
  // 초록 버튼 누름 = 누른 자리에서 퍼지는 어두움(§5.3)
  function ripple(btn, e) {
    if (!btn.querySelector(':scope>.bl')) { var bl = document.createElement('span'); bl.className = 'bl'; while (btn.firstChild) bl.appendChild(btn.firstChild); btn.appendChild(bl); }
    var r = btn.getBoundingClientRect(), x = e.clientX - r.left;
    var sp = document.createElement('span'); sp.className = 'rip'; sp.style.left = x + 'px';
    sp.style.setProperty('--rs', Math.ceil(Math.hypot(Math.max(x, r.width - x), r.height / 2) / 15) + 1);
    btn.appendChild(sp); requestAnimationFrame(function () { sp.classList.add('go'); });
    function end() { sp.classList.add('fade'); setTimeout(function () { sp.remove(); }, 340); btn.removeEventListener('pointerup', end); btn.removeEventListener('pointerleave', end); }
    btn.addEventListener('pointerup', end); btn.addEventListener('pointerleave', end);
  }
  app.addEventListener('pointerdown', function (e) { var b = e.target.closest('.cta,.cm-btn.primary'); if (b && !b.closest('.sk')) ripple(b, e); });
  // 창 아래로 끌어 닫기(§4.3-5): 손잡이 줄과 빈 곳을 잡으면 따라 내려가고, 80px 넘게 내리면 닫힘
  var dragY = null, dragDy = 0, dragEl = null;
  ov.addEventListener('pointerdown', function (e) {
    var bs = e.target.closest('.bs.on'); if (!bs || e.target.closest('button')) return;
    dragEl = bs; dragY = e.clientY; dragDy = 0; bs.classList.add('grab', 'press');
    try { bs.setPointerCapture(e.pointerId); } catch (_) {}
  });
  ov.addEventListener('pointermove', function (e) { if (dragY === null) return; dragDy = Math.max(0, e.clientY - dragY); dragEl.style.transform = 'translateY(' + dragDy + 'px)'; });
  function dragEnd() {
    if (dragY === null) return;
    var bs = dragEl; dragY = null; bs.classList.remove('grab', 'press');
    if (dragDy > 80) userClose(); else bs.style.transform = '';
  }
  ov.addEventListener('pointerup', dragEnd); ov.addEventListener('pointercancel', dragEnd);

  boot();
})();
</script>
