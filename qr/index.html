<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>반출납 — 생각공작소</title>
<meta name="robots" content="noindex">
<!-- 외우기 쉬운 주소. 정본은 /q (라벨 QR이 담는 짧은 주소) — 여기선 쿼리를 그대로 넘겨 보낸다.
     QR 스캔은 /q로 바로 들어오므로 이 한 번의 이동은 주소를 직접 치는 사람에게만 생긴다. -->
<script>location.replace('/q/' + (location.search || ''));</script>
</head>
<body></body>
</html>
