<!-- 문자 링크 이어보기 = 26 문의알리미 INQ_LINK(https://think-factory.kr/c/?k=열쇠). 주소에 대화 열쇠가 실리므로 일부러:
     ① 방문 통계(analytics.js) 없음 — 열쇠 든 주소가 Clarity에 안 남는다(사전 계획 2026-10-10 ②, 유성 「숫자를 흐린다」도 같이)
     ② referrer 없음 — 창 안 링크를 눌러 나갈 때 이 주소가 상대 사이트로 안 넘어간다
     ③ 검색 제외 · 열쇠는 이 기기에 저장한 뒤 주소창에서 지운다(화면 캡처·주소 공유로 안 새게)
     창 코드 = /js/inquiry-pane.js(홈페이지 「문의하기」와 같은 파일, page 모드). 설계 = 생각공작소 docs/4_설계_2026-10-08_문의알리미_1단계.md -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

<style>
  body{margin:0;background:#fff}
  @media (min-width:761px){body{background:var(--g50)}}
  .c-fb{max-width:360px;margin:30vh auto 0;padding:0 24px;text-align:center;font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;color:var(--g900);word-break:keep-all}
  .c-fb b{display:block;font-size:17px;margin-bottom:6px}
  .c-fb p{margin:0 0 18px;color:var(--g600);font-size:14px;line-height:1.5}
  .c-fb button{border:0;border-radius:14px;background:var(--green600);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:14px 22px;cursor:pointer}
  .c-fb button:active{background:var(--green700)}
</style>

<noscript><div class="c-fb"><b>문의 창을 열 수 없어요</b><p>전화(032-277-2007)로 문의할 수 있어요.</p></div></noscript>
<script>
(function () {
  var GAS = 'https://script.google.com/macros/s/AKfycbwUdo5pLFvgVxu_3EjspA6U6U196Hu-RzKcC0ucVwRPGMBP3oIQT2fKMK_7fvLmeOx9Gg/exec';
  var k = (location.search.match(/[?&]k=([A-Za-z0-9]{6,40})/) || [])[1] || '';
  if (location.search) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  function fail() {   // 창 코드를 못 받음(연결 끊김) = 빈 화면 대신 다시 불러오기(§4.5 — 빨강 없음, 주액션 하나)
    document.body.insertAdjacentHTML('beforeend', '<div class="c-fb"><b>대화를 아직 못 불러왔어요</b><p>인터넷이 느리면 조금 더 걸려요</p><button type="button" onclick="location.reload()">다시 불러오기</button></div>');
  }
  var s = document.createElement('script');
  s.src = '/js/inquiry-pane.js?v=6';
  s.onload = function () { window.tfInqPane.open({ gas: GAS, page: true, key: k }); };
  s.onerror = fail;
  document.head.appendChild(s);
})();
</script>
