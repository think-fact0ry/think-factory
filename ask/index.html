<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의 | 생각공작소</title>
<meta name="robots" content="noindex">
<!-- 문의 창이 열린 홈페이지로 바로 보내는 짧은 주소(10-13 유성 — 25 부재중 알림톡 「그 밖의 문의」 줄).
     홈페이지 + 창 열림 = js/inquiry.js의 ?inq=open. 창을 닫으면 그대로 홈페이지라 서비스도 둘러볼 수 있다. -->
<meta http-equiv="refresh" content="0; url=/?inq=open">
<script>location.replace('/?inq=open');</script>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:30vh"><a href="/?inq=open">문의 창 열기</a></p>
</body>
</html>
