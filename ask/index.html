<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="/js/kakao-escape.js"></script>
<script src="/js/analytics.js" async></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>문의 | 생각공작소</title>
<meta name="robots" content="noindex">
<!-- 문의 창 바로 열기 = 25 부재중 알림톡 「그 밖의 문의」 주소(10-13 유성, 25 MC_ASK_URL — 알림톡 승인본에 박힘, 주소 그대로).
     10-18 가벼운 창 페이지로(유성 「모바일로 /ask … 로딩심함 … 바로 들어가졌으면」): 전엔 홈페이지(/?inq=open)로 넘겨 그 위에 창을 열었는데,
     홈페이지를 영상까지 다 받은(load) 뒤에야 창 코드를 받기 시작해 폰에서 대화가 보이기까지 와이파이 4.5초, 느린 4G 10초(실측, CPU 4배 느리게).
     이제 = 문자 링크(/c/)와 같은 페이지 모드 + 대화 읽기(열쇠 있으면 v_load, 없으면 v_mode)를 창 코드와 같이 보냄.
     닫기(X), 동의 「나중에」 = 홈페이지로(10-13 「창을 닫으면 그대로 홈페이지라 서비스도 둘러볼 수 있다」는 그대로). 다른 점 = 폰 뒤로가기는 들어온 곳(카톡)으로.
     /c/와 다른 점: 주소에 열쇠가 없어 방문 통계 있음(전처럼 이 방문이 통계에 남게), 카톡 인앱이면 기본 브라우저로(§3.7 — 전엔 홈페이지가 했다).
     창 코드 = /js/inquiry-pane.js(?v= 올릴 때 = js/inquiry.js PANE_SRC + c/index.html + 여기 세 곳). 감시 = 생각공작소 scripts/26_문의알리미/tests/창.test.js 「/ask」 -->
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/site.css">
<style>
  body{margin:0;background:#fff}
  @media (min-width:761px){body{background:var(--g50)}}
  .c-fb{max-width:360px;margin:30vh auto 0;padding:0 24px;text-align:center;font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;color:var(--g900);word-break:keep-all}
  .c-fb b{display:block;font-size:17px;margin-bottom:6px}
  .c-fb p{margin:0 0 18px;color:var(--g600);font-size:14px;line-height:1.5}
  .c-fb button{border:0;border-radius:14px;background:var(--green600);color:#fff;font:inherit;font-size:16px;font-weight:700;padding:14px 22px;cursor:pointer}
  .c-fb button:active{background:var(--green700)}
</style>
</head>
<body>
<noscript><div class="c-fb"><b>문의 창을 열 수 없어요</b><p>전화(032-277-2007)로 문의할 수 있어요.</p></div></noscript>
<script>
(function () {
  var GAS = 'https://script.google.com/macros/s/AKfycbwUdo5pLFvgVxu_3EjspA6U6U196Hu-RzKcC0ucVwRPGMBP3oIQT2fKMK_7fvLmeOx9Gg/exec';
  function fail() {   // 창 코드를 못 받음(연결 끊김) = 빈 화면 대신 다시 불러오기(§4.5 — 빨강 없음, 주액션 하나)
    document.body.insertAdjacentHTML('beforeend', '<div class="c-fb"><b>문의 창을 아직 못 불러왔어요</b><p>인터넷이 느리면 조금 더 걸려요</p><button type="button" onclick="location.reload()">다시 불러오기</button></div>');
  }
  // 첫 읽기를 창 코드와 같이 보낸다 — 창이 같은 요청이면 이 답을 쓰고, 못 받았으면(null) 다시 읽는다.
  //   열쇠 없음 + 모드 3분 기억이 있으면 안 보냄(창이 기억으로 바로 그려 v_mode를 안 묻는다)
  var key = '', mode = null; try { key = localStorage.getItem('tf_inq_key') || ''; mode = JSON.parse(sessionStorage.getItem('tf_inq_mode') || 'null'); } catch (e) {}
  var body = key ? { action: 'v_load', key: key } : mode && Date.now() - mode.at < 180000 ? null : { action: 'v_mode' };
  var pre = !body ? null : { id: body.action + '|' + (body.key || ''), at: Date.now(), p: fetch(GAS, { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.text(); }).then(function (t) { return JSON.parse(t); }).catch(function () { return null; }) };
  var s = document.createElement('script');
  s.src = '/js/inquiry-pane.js?v=15';
  s.onload = function () { window.tfInqPane.open({ gas: GAS, page: true, src: '/ask', pre: pre }); };
  s.onerror = fail;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
