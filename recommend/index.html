<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{ --g100:#f2f4f6; --g200:#e5e8eb; --green:#3a8a5f; }
  *{ box-sizing:border-box; }   /* ⚠️ 폼과 같은 상자 모델 — 이게 없으면 .sk-card가 padding 48px만큼 폼 카드보다 넓어져(360폭 372 vs 336) 폰에서 화면 밖으로 삐져나가고 줄바꿈이 달라진다(유성 09-09 "모바일 스켈레톤이 PC판 같다", 헤드리스 실측) */
  html,body{ margin:0; height:100%; background:#f7f5f1; }   /* 폼 캔버스와 같은 색(§3.6-3) — svh 아래 남는 띠가 폼과 같아 보인다 */
  /* 22 추천서 접수 폼(GAS 웹앱, doGet ALLOWALL) 임베드 — 배너 없는 브랜드 URL. 폼 안 fixed(토스트·종료 안내)는 iframe이 화면 전체라 그 자리가 곧 화면 하단 */
  .rc-wrap{ position:relative; height:100vh; height:100svh; height:100dvh; }
  .rc-frame{ display:block; width:100%; height:100%; border:0; background:#f7f5f1; }
  /* 폼이 오기 전 수 초(GAS 콜드스타트): 백지 대신 첫 화면과 같은 자리의 뼈대 + 훑기 모션(§5.4, /contact 래퍼와 같은 것 — 2026-10-01 링 제거).
     글자는 실제 문구를 투명색으로 깔아 폰에서 줄이 바뀌어도 카드 높이가 실물과 같다. 폼이 브릿지 ready를 보내면 걷힌다(body.form-ready). 기다림 문구·연결 끊김·다시 불러오기 = /js/form-wait.js(뼈대 위에 겹침, 위치 불변). 옛 load+8초 안전망 폐기(오류 페이지에도 load가 발화).
     ⚠️ 폼 첫 화면 문구·치수(Index.html .intro-card)를 바꾸면 여기도(0-9). */
  .apply-skel{ position:absolute; inset:0; z-index:1; background:#f7f5f1; padding:0 16px; overflow:hidden; display:flex; flex-direction:column; justify-content:center; }
  .apply-skel .sk-card{ background:#fff; border-radius:20px; padding:30px 24px; box-shadow:0 1px 4px rgba(0,0,0,.05); width:100%; max-width:508px; margin:0 auto; font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif; font-size:16px; line-height:1.6; letter-spacing:0; word-break:keep-all; color:transparent; -webkit-text-size-adjust:100%; position:relative; }
  .apply-skel .sk-t{ background:var(--g100); color:transparent; border-radius:6px; -webkit-box-decoration-break:clone; box-decoration-break:clone; position:relative; top:2px; }
  .apply-skel .sk-t b{ color:transparent; }
  .apply-skel .sk-chip{ display:inline-block; font-size:12px; font-weight:700; padding:5px 12px; border-radius:99px; background:var(--g100); color:transparent; margin-bottom:16px; }
  .apply-skel .sk-h1{ font-size:clamp(23px,3.4vw,30px); font-weight:700; letter-spacing:-.5px; line-height:1.35; margin:0 0 10px; }
  .apply-skel .sk-sub{ font-size:13.5px; margin:0 0 22px; }
  .apply-skel .sk-box{ background:var(--g100); border:1px solid transparent; border-radius:14px; padding:18px; margin-bottom:24px; }
  .apply-skel .sk-box p{ font-size:14.5px; line-height:1.75; margin:0; }
  .apply-skel .sk-box p+p{ margin-top:12px; }
  .apply-skel .sk-box .sk-t{ background:#fff; opacity:.9; }
  .apply-skel .sk-btn{ padding:17px; font-size:17px; font-weight:700; line-height:normal; text-align:center; border-radius:15px; background:var(--g100); }
  .apply-skel .sk-g{ margin-top:12px; padding:14px; font-size:14px; font-weight:600; line-height:normal; text-align:center; }
  @media (max-width:380px){ .apply-skel{ padding:0 12px; } .apply-skel .sk-card{ padding:24px 18px; } }
  body.form-ready .apply-skel{ display:none; }
</style>
<script src="/js/form-wait.js"></script>

<body>
<div class="rc-wrap">
  <div class="apply-skel" id="applySkel" aria-hidden="true">
    <div class="sk-card">
      <span class="sk-chip">생각공작소</span>
      <div class="sk-h1"><span class="sk-t">추천서 신청</span></div>
      <p class="sk-sub"><span class="sk-t">적어주신 내용은 추천서 작성에만 써요.</span></p>
      <div class="sk-box"><p><span class="sk-t">아동청소년 심리지원 바우처를 신청할 때 필요한 추천서를 저희 임상심리사 선생님이 작성해 드려요.</span></p><p><span class="sk-t">아이의 정보와 평소 모습을 적어주세요 ☺️</span></p><p><span class="sk-t">추천서를 신청할 아이가 여러 명이면 <b>한 명씩 따로</b> 적어주세요.</span></p></div>
      <div class="sk-btn">작성하기</div>
      <div class="sk-g"><span class="sk-t">이미 신청했나요? 내용 수정하기 →</span></div>
    </div>
  </div>
  <!-- 파라미터 전달 안 함(하드코딩 /exec) — doGet은 인자를 받지 않는다(/receipt·/feedback과 같은 결) -->
  <iframe class="rc-frame" title="추천서 신청"
    src="https://script.google.com/macros/s/AKfycbxiaIfUdh0q1C_OF65xmk-4QQLUklWPjcq2ZKBVpnI5TYhHV9TXyKUUWqRxEkZk_WnR0A/exec"></iframe>
</div>
<script>
// 폼(iframe) 대기 화면 = /js/form-wait.js — 폼의 ready(브릿지)로 뼈대를 걷고, 늦으면 문구·끊김 알림·다시 불러오기를 뼈대 위에 띄운다.
if (window.tfFormWait) window.tfFormWait({ frame: document.querySelector('.rc-frame'), skel: document.getElementById('applySkel'), card: document.querySelector('#applySkel .sk-card'), obj: '신청서를' });
</script>
<script>if (/[?&]kbd=1/.test(location.search)) { var s = document.createElement('script'); s.src = '/js/kbd-diag.js'; document.body.appendChild(s); }</script>   <!-- 키보드 실기기 진단(?kbd=1일 때만, js/kbd-diag.js 머리말) -->
</body>
