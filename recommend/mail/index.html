<title>메일 주소 고치기 — 생각공작소</title>
<!--
  think-factory.kr/recommend/mail/ — 22 추천서 메일이 반송된 보호자가 받을 주소를 다시 적는 창(2026-10-09 유성
  「맞는 주소 적는 창만 보내면 되잖아. 거기 적으면 수정돼서 추천서까지 자동 발송」).
  입구 = 반송 안내 알림톡 버튼 「메일 주소 고치기」 / 문자판 링크(22 발송.js MF_PAGE). 서버 = 22 웹앱 doPost 'mailfix'(메일고치기.js).
  화면은 22 접수 폼(scripts/22_추천서/Index.html)의 토큰과 부품을 그대로 옮겼다: 「수정 찾기」 화면 골격(.app-h1/.app-sub/.field.uf),
  이메일 = 아이디 @ 도메인 콤보(§4.1-10), 휴대폰 자동 하이픈(§4.1-11), 생년월일 예시 0000. 00. 00, 게이팅 CTA(§4.1-5), 완료(§4.6).
  보내기는 한 번만(작업 번호로 결과를 묻는다 — 응답이 구글 HTML로 와도 「못 보냈다」로 단정하지 않음, 메모리 gas-webapp-reply-can-be-google-html).
  ?demo=1 = 서버 없이 화면만(헤드리스 확인용). ⚠️ 사용자 문구에 가운뎃점(U+00B7) 금지.
-->

<script>
// 카톡 인앱 브라우저 = 상하단 바가 버튼을 가린다 → 기본 브라우저로(/recommend와 같은 결)

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db; --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g900:#191f28;
    --green100:#e9f8ee; --green600:#3a8a5f; --green700:#166841; --green:var(--green600); --green-dark:var(--green700);
    --red:#f04452; --ink-on-dark:#F9FBFA; --p-disabled:#b7e0c8;
    --r-sm:clamp(7px,1.8vw,10px); --r-md:clamp(10px,2.6vw,14px);
    --fs-h1:clamp(23px,3.4vw,30px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; background:#fff; }
  body{ font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif; color:var(--g900); line-height:1.6; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; word-break:keep-all;
        -webkit-user-select:none; user-select:none; }
  input{ -webkit-user-select:text; user-select:text; font-family:inherit; }
  button{ font-family:inherit; }
  .wrap{ max-width:540px; margin:0 auto; padding:28px 16px 40px; }
  @media (max-width:380px){ .wrap{ padding:22px 12px 32px; } }
  .scr{ display:none; } .scr.on{ display:block; }

  /* 22 「수정 찾기」 화면 골격 */
  .app-h1{ font-size:var(--fs-h1); font-weight:700; letter-spacing:-.5px; line-height:1.32; margin:8px 0 8px; }
  .app-sub{ font-size:14px; color:var(--g600); font-weight:500; line-height:1.5; margin-bottom:26px; }
  .sent-to{ font-size:14px; color:var(--g600); margin:-14px 0 26px; }
  .sent-to b{ color:var(--g900); font-weight:600; word-break:break-all; }

  /* 입력(22 Index.html §4.1 복제) — 밑줄형 .field.uf */
  .field{ margin-bottom:24px; }
  .field>label{ display:block; font-size:12.5px; line-height:1.5; font-weight:600; color:var(--g600); margin:0 0 5px; letter-spacing:-.2px; transition:color .15s; }
  .field:focus-within>label, .field.sopen>label{ color:var(--green); }
  .in{ width:100%; padding:13px 16px; border:1.5px solid transparent; border-radius:var(--r-md); font-size:17px; font-weight:500; line-height:1.5; color:var(--g900);
       background:var(--g100); outline:none; -webkit-appearance:none; appearance:none; transition:background .15s,border-color .15s; letter-spacing:-.2px; caret-color:var(--green); }
  .in::placeholder{ color:var(--g500); font-weight:500; }
  .in:focus{ background:#fff; border-color:var(--green); }
  .inw{ position:relative; }
  .clr{ display:none; position:absolute; right:0; top:50%; transform:translateY(-50%); width:15px; height:15px; border:none; border-radius:50%; background:var(--g300); color:#fff; padding:0; cursor:pointer; align-items:center; justify-content:center; }
  .inw.has-val .clr{ display:flex; }
  .clr svg{ width:7px; height:7px; display:block; }
  .field.uf .inw{ border-bottom:2px solid var(--g200); transition:border-color .15s; }
  .field.uf .inw:focus-within{ border-color:var(--green); }
  .field.uf .inw .in{ background:none; border:none; border-radius:0; padding:2px 34px 3px 0; font-size:18px; font-weight:600; line-height:1.5; }
  .field.uf .inw .in:focus{ background:none; }
  .field.err .inw{ border-color:var(--red); }
  .field.err>label{ color:var(--red); }
  .field.err .dom .in{ border-color:var(--red); background:#fff; }

  /* 이메일 = 아이디(밑줄) @ 도메인(채움 콤보) — §4.1-10, 22 .email-row/.dom 복제 */
  .email-row{ display:flex; align-items:center; gap:8px; }
  .email-row .inw{ flex:1 1 0; min-width:0; }
  .email-row .inw .in{ font-size:17px; padding-right:28px; }
  .email-row .at{ flex-shrink:0; font-size:17px; font-weight:600; color:var(--g500); }
  .dom{ position:relative; flex:1.3 1 0; min-width:0; }
  .dom .in{ padding-right:38px; height:48px; padding-top:0; padding-bottom:0; font-size:16px; }
  .dom-tg{ position:absolute; right:2px; top:50%; transform:translateY(-50%); width:34px; height:36px; border:none; background:none; color:var(--g500); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:transform .2s; }
  .dom-tg svg{ width:20px; height:20px; }
  .dom.open .dom-tg{ transform:translateY(-50%) rotate(180deg); }
  .sel-list{ display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); background:#fff; border-radius:var(--r-md); box-shadow:0 6px 24px rgba(0,0,0,.14); padding:6px; z-index:10; }
  .sel-list.open{ display:block; }
  .sel-item{ padding:13px 14px; border-radius:var(--r-sm); font-size:16px; font-weight:500; color:var(--g700); letter-spacing:-.2px; cursor:pointer; }
  .sel-item:hover,.sel-item:active{ color:var(--green-dark); font-weight:700; }

  /* 버튼(§4.14) + 게이팅(§4.1-5) */
  .btn{ width:100%; padding:18px; border:none; border-radius:15px; font-size:17px; font-weight:700; color:#fff; background:var(--green); cursor:pointer;
        transition:transform .08s,opacity .2s; letter-spacing:-.3px; position:relative; margin-top:12px; }
  .btn:active{ transform:scale(.97); background:var(--green-dark); }
  .btn.gate{ background:var(--p-disabled); }
  .btn.gate:active{ background:var(--p-disabled); }
  @keyframes shakeX{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
  .shake{ animation:shakeX .28s cubic-bezier(.36,.07,.19,.97); }
  /* 1차 CTA = 화면 하단(유성 10-09 「위에 다 몰려 있어서 버튼을 아래에」, docs/1 §4.1-5) — 내용이 짧으면 버튼만 아래로, 길면 내용 끝에 이어진다 */
  #scr-form.on{ display:flex; flex-direction:column; min-height:calc(100svh - 68px); }
  #scr-form #sendBtn{ margin-top:auto; }
  @media (max-width:380px){ #scr-form.on{ min-height:calc(100svh - 54px); } }
  html{ scroll-padding-bottom:84px; }
  @media (any-pointer:coarse){
    body:has(#scr-form.on input:focus) #sendBtn:not(.gate){ position:fixed; left:0; right:0; bottom:0; width:auto; z-index:50; border-radius:0; padding:19px; margin:0; transition:none; }
  }

  /* 완료(§4.6 — 22 .done-box 복제) */
  #scr-done.on{ display:flex; flex-direction:column; justify-content:center; min-height:calc(100svh - 68px); }
  .done-box{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 12px; }
  .done-icon{ width:80px; height:80px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; margin-bottom:22px; animation:iconPop .42s cubic-bezier(.2,.9,.3,1.3) both; }
  .done-icon svg{ width:38px; height:38px; stroke:#fff; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  @keyframes iconPop{ 0%{ transform:scale(.5); opacity:0; } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); opacity:1; } }
  .done-title{ font-size:21px; font-weight:800; letter-spacing:-.4px; line-height:1.45; }
  .done-sub{ font-size:14.5px; font-weight:500; color:var(--g700); margin-top:10px; word-break:break-all; }

  /* 기다림(22 .loading 복제) + 토스트 + 확인 다이얼로그(§4.4) */
  .loading{ position:fixed; inset:0; z-index:1200; background:rgba(255,255,255,.78); display:none; flex-direction:column; gap:14px; align-items:center; justify-content:center; }
  .loading.show{ display:flex; }
  .spinner{ width:42px; height:42px; border:3px solid var(--g100); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading p{ font-size:14.5px; font-weight:600; color:var(--g600); }
  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--g900); color:var(--ink-on-dark);
          font-size:14px; font-weight:600; padding:12px 18px; border-radius:12px; max-width:90%; text-align:center; white-space:pre-line; opacity:0;
          transition:opacity .2s,transform .2s; pointer-events:none; z-index:1300; line-height:1.5; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  .dim{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1400; display:none; align-items:center; justify-content:center; }
  .dim.on{ display:flex; }
  .cmodal{ width:calc(100% - 84px); max-width:320px; background:#fff; border-radius:20px; padding:24px 20px 18px; }
  .cmodal h3{ font-size:18px; font-weight:700; letter-spacing:-.3px; line-height:1.45; }
  .cmodal p{ font-size:14.5px; color:var(--g700); margin-top:8px; line-height:1.55; word-break:break-all; }
  .cmodal p b{ color:var(--g900); }
  .cm-btns{ display:flex; gap:8px; margin-top:16px; }
  .cm-btns button{ flex:1; padding:14px 6px; border:none; border-radius:var(--r-md); font-size:15.5px; font-weight:700; cursor:pointer; transition:transform .08s; }
  .cm-btns button:active{ transform:scale(.97); }
  .cm-weak{ background:var(--g100); color:var(--g700); }
  .cm-main{ background:var(--green); color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <section class="scr on" id="scr-form">
    <h1 class="app-h1">받을 메일 주소를<br>다시 적어주세요</h1>
    <p class="app-sub">신청할 때 적은 휴대폰 번호와 아이 생년월일로 찾아요.</p>
    <div class="field uf" id="f-phone"><label for="phone">휴대폰 번호</label><div class="inw"><input class="in" id="phone" type="tel" inputmode="numeric" placeholder="010-0000-0000" readonly autocomplete="off"><button type="button" class="clr" tabindex="-1" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button></div></div>
    <div class="field uf" id="f-dob"><label for="dob">아이 생년월일</label><div class="inw"><input class="in" id="dob" type="tel" inputmode="numeric" placeholder="0000. 00. 00" readonly autocomplete="off"><button type="button" class="clr" tabindex="-1" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button></div></div>
    <div class="field uf" id="f-email"><label for="email">받을 메일 주소</label>
      <div class="email-row">
        <div class="inw"><input class="in" id="email" type="text" inputmode="email" autocapitalize="off" autocorrect="off" readonly autocomplete="off"><button type="button" class="clr" tabindex="-1" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button></div>
        <span class="at">@</span>
        <div class="dom" id="domWrap">
          <input class="in" id="domain" type="text" inputmode="email" autocapitalize="off" autocorrect="off" value="naver.com" autocomplete="off">
          <button type="button" class="dom-tg" id="domTg" aria-label="도메인 고르기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="sel-list" id="domList">
            <div class="sel-item">naver.com</div><div class="sel-item">gmail.com</div><div class="sel-item">hanmail.net</div><div class="sel-item">daum.net</div><div class="sel-item">kakao.com</div><div class="sel-item">nate.com</div>
          </div>
        </div>
      </div>
    </div>
    <button class="btn gate" type="button" id="sendBtn">추천서 다시 받기</button>
  </section>

  <section class="scr" id="scr-done">
    <div class="done-box">
      <div class="done-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="done-title">추천서를 다시 보냈어요</div>
      <div class="done-sub" id="doneSub"></div>
    </div>
  </section>
</div>

<div class="loading" id="loading"><div class="spinner"></div><p>보내고 있어요</p></div>
<div class="toast" id="toast"></div>
<div class="dim" id="typoDim"><div class="cmodal" role="dialog" aria-modal="true">
  <h3>이 주소가 맞나요?</h3>
  <p>적은 주소 <b id="typoGot"></b><br>혹시 <b id="typoFix"></b> 아닌가요?</p>
  <div class="cm-btns"><button type="button" class="cm-weak" id="typoKeep">적은 대로</button><button type="button" class="cm-main" id="typoUse">고쳐서 보내기</button></div>
</div></div>

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbxiaIfUdh0q1C_OF65xmk-4QQLUklWPjcq2ZKBVpnI5TYhHV9TXyKUUWqRxEkZk_WnR0A/exec';   // 22 웹앱(@ 고정 배포)
var DEMO = /demo=1/.test(location.search);
function $(id){ return document.getElementById(id); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

/* ── 입력 공통(22 Index.html 복제) ── */
document.addEventListener('focusin', function(e){ if(e.target && e.target.tagName==='INPUT' && e.target.hasAttribute('readonly')) e.target.removeAttribute('readonly'); });   // 자동완성 막기(§4.1-6)
function wireClr(inp){
  var inw = inp.closest('.inw'); if(!inw) return; var clr = inw.querySelector('.clr');
  var upd = function(){ inw.classList.toggle('has-val', inp.value.length>0); };
  inp.addEventListener('input', upd);
  clr.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  clr.addEventListener('click', function(){ inp.value=''; inp.dispatchEvent(new Event('input')); inp.focus(); });
  upd();
}
$$('.inw input').forEach(wireClr);
document.addEventListener('input', function(e){ var fd = e.target.closest && e.target.closest('.field.err'); if(fd) fd.classList.remove('err'); });
function formatPhone(v){ var d=v.replace(/\D/g,'').slice(0,11); if(d.length<4) return d; if(d.length<8) return d.slice(0,3)+'-'+d.slice(3); return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7); }
function fmtBirth(v){ var d=String(v||'').replace(/\D/g,'').slice(0,8); var out=d.slice(0,4); if(d.length>4) out+='. '+d.slice(4,6); if(d.length>6) out+='. '+d.slice(6,8); return out; }
function validDob8(d){ if(d.length!==8) return false; var y=+d.slice(0,4), m=+d.slice(4,6), dd=+d.slice(6,8); if(y<1900||m<1||m>12||dd<1||dd>31) return false; var dt=new Date(y,m-1,dd); if(dt.getMonth()!==m-1 || dt.getDate()!==dd) return false; return dt<=new Date(); }
(function(){ var ph=$('phone');
  ph.addEventListener('focus', function(){ ph._wasFull = ph.value.replace(/\D/g,'').length>=11; });
  ph.addEventListener('input', function(){ ph.value=formatPhone(ph.value); if(ph.value.replace(/\D/g,'').length===11 && !ph._wasFull){ setTimeout(function(){ $('dob').focus(); }, 60); } });
})();
(function(){ var d=$('dob');
  d.addEventListener('focus', function(){ d._wasFull = d.value.replace(/\D/g,'').length>=8; });
  d.addEventListener('input', function(){ d.value=fmtBirth(d.value); if(d.value.replace(/\D/g,'').length===8 && !d._wasFull){ setTimeout(function(){ $('email').focus(); }, 60); } });
})();
$('email').addEventListener('input', function(){ this.value=this.value.replace(/[@\s]/g,''); });
(function(){   // 도메인 콤보(§4.1-10)
  var wrap=$('domWrap'), inp=$('domain'), list=$('domList'), tg=$('domTg');
  function open(o){ list.classList.toggle('open', o); wrap.classList.toggle('open', o); $('f-email').classList.toggle('sopen', o); }
  tg.onclick = function(e){ e.stopPropagation(); open(!list.classList.contains('open')); };
  $$('.sel-item', list).forEach(function(it){ it.onclick = function(){ inp.value=it.textContent; open(false); gateUpdate(); }; });
  inp.addEventListener('input', function(){ inp.value=inp.value.replace(/[@\s]/g,''); });
  inp.addEventListener('focus', function(){ open(false); });
  document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) open(false); });
})();
var toastT;
/* 토스트 자리 = 보이는 「추천서 다시 받기」 위 12px(docs/1 §5.5, 22 접수 폼과 같은 식). 버튼을 화면 맨 아래로 내린 뒤(§4.1-5, 10-09) 고정 90px이면 큰 폰에서 버튼을 덮었다(10-10 실측 6px).
   버튼이 없거나 화면 밖이면 '' = CSS 기본(90px). 문구를 먼저 넣어야 토스트 높이(줄 수)가 정해져 클램프가 맞다 */
function toastBottom(t){
  var vh=window.innerHeight, th=(t && t.offsetHeight) || 66, lim=Math.max(30, vh-th-8);
  var b=document.querySelector('#scr-form.on #sendBtn'); if(!b || !b.getClientRects().length) return '';
  var top=b.getBoundingClientRect().top; if(top>=vh) return '';
  return Math.min(Math.max(Math.round(vh-top)+12, 30), lim)+'px';
}
function toast(m, ms){ var t=$('toast'); t.textContent=m; t.style.bottom=toastBottom(t); t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, ms || 2800); }

/* ── 게이팅(§4.1-5) — 세 칸이 다 차기 전엔 연초록, 누르면 흔들고 빠진 칸 ── */
function vals(){ return { phone:$('phone').value.replace(/\D/g,''), dob:$('dob').value.replace(/\D/g,''), local:$('email').value.trim(), domain:$('domain').value.trim().toLowerCase() }; }
function check(quiet){
  var v=vals(), bad=null;
  if(v.phone.length<10) bad=['f-phone','휴대폰 번호를 확인해주세요.'];
  else if(!validDob8(v.dob)) bad=['f-dob','아이 생년월일을 확인해주세요.'];
  else if(!v.local || !/^[^@\s]+\.[^@\s]+$/.test(v.domain)) bad=['f-email','받을 메일 주소를 확인해주세요.'];
  if(bad && !quiet){ $(bad[0]).classList.add('err'); toast(bad[1]); }
  return !bad;
}
function gateUpdate(){ $('sendBtn').classList.toggle('gate', !check(true)); }
['input','change','click'].forEach(function(ev){ document.addEventListener(ev, function(){ setTimeout(gateUpdate, 0); }, true); });
$('sendBtn').addEventListener('pointerdown', function(e){ var ae=document.activeElement; if(ae && ae.tagName==='INPUT' && getComputedStyle(this).position==='fixed') e.preventDefault(); });   // 키보드 위 버튼이 튀며 누름이 빠지는 것 막기(22 09-27)

/* ── 서버 — 보내기는 한 번만, 결과는 작업 번호로 묻는다 ── */
function post(body){
  if(DEMO) return demoPost(body);
  return fetch(GAS, { method:'POST', body:JSON.stringify(body) }).then(function(r){ return r.text(); }).then(function(t){
    var o; try{ o = JSON.parse(t); }catch(e){ throw new Error('BAD_REPLY'); }
    if(o.error) throw new Error(o.error);
    return o.data;
  });
}
var busy=false;
function send(force){
  if(busy) return;
  var v=vals(), job=Math.random().toString(36).slice(2,10)+Date.now().toString(36), done=false, t0=Date.now(), timer=0;
  var body={ action:'mailfix', phone:v.phone, dob:v.dob, email:v.local+'@'+v.domain, force:!!force, job:job };
  busy=true; if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('loading').classList.add('show');
  function finish(r){
    if(done) return; done=true; clearInterval(timer); busy=false; $('loading').classList.remove('show');
    if(!r){ toast('결과를 아직 못 받았어요.\n잠시 뒤 메일함을 확인해주세요.', 4000); return; }
    if(r.ok){ $('doneSub').textContent=body.email+' 메일함을 확인해주세요'; $('scr-form').classList.remove('on'); $('scr-done').classList.add('on'); return; }
    if(r.code==='typo'){ $('typoGot').textContent=body.email; $('typoFix').textContent=r.typo; $('typoDim').classList.add('on'); return; }
    if(r.code==='bounce' || r.code==='email') $('f-email').classList.add('err');
    if(r.code==='nomatch'){ $('f-phone').classList.add('err'); $('f-dob').classList.add('err'); }
    toast(r.message || '지금은 보내지 못했어요.', 3600);
  }
  post(body).then(finish).catch(function(){ /* 응답을 못 받아도 서버는 하고 있을 수 있다 → 아래 묻기가 끝을 안다 */ });
  timer=setInterval(function(){
    if(Date.now()-t0 > 180000){ finish(null); return; }
    post({ action:'mailfixres', job:job }).then(function(x){ if(x && x.st==='done') finish(x.r); }).catch(function(){});
  }, 4000);
}
$('sendBtn').onclick=function(){
  var b=this; if(b.classList.contains('gate')){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); check(false); return; }
  send(false);
};
$('typoKeep').onclick=function(){ $('typoDim').classList.remove('on'); send(true); };
$('typoUse').onclick=function(){ var fix=$('typoFix').textContent.split('@'); $('email').value=fix[0]; $('domain').value=fix[1]; $('typoDim').classList.remove('on'); gateUpdate(); send(false); };
$('typoDim').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('on'); });

/* ── 데모(?demo=1, 서버 없음) — 생년월일 2015.03.15 + 010-1234-5678만 맞음, naver.con은 오타 확인 ── */
function demoPost(b){
  return new Promise(function(res){ setTimeout(function(){
    if(b.action==='mailfixres') return res(null);
    if(/naver\.con$/.test(b.email) && !b.force) return res({ ok:false, code:'typo', typo:b.email.replace(/con$/,'com') });
    if(b.phone!=='01012345678' || b.dob.slice(2)!=='150315') return res({ ok:false, code:'nomatch', message:'정보가 맞는 신청을 찾지 못했어요.\n휴대폰 번호와 아이 생년월일을 다시 확인해주세요.' });
    res({ ok:true });
  }, 900); });
}
gateUpdate();
