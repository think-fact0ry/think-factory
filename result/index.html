<!--
  think-factory.kr/result/?k=<열쇠> — 검사 결과지 메일을 못 받은 보호자가 다시 받는 창(2026-11-24, 07 결과지발송.js).
  입구 = 알림톡 틀 1 「메일 보냈어요」의 「받지 못했어요」 버튼(유성 11-24 — 「받지 못한 이유는 메일 주소 뿐만이 아닐 수 있어」), 틀 2 「전달 안 됐어요」 버튼(`/result/?k=#{열쇠}` — 틀에 굳은 주소, 옮기지 말 것).
  다른 주소 = 고쳐 보냄 / 같은 주소 = 한 번 더(스팸함, 잠깐 반송) / 그 주소로 두 번 간 뒤 = 끝 화면에 센터 번호 + 「다른 주소로 받기」.
  서버 = 07 웹앱 doPost 공개 동작 rp_open / rp_fix / rp_res(열쇠 검사 앞 — 지키는 것 = 열쇠 + 아이 생년월일, 5번 틀리면 1시간 잠김, 보낸 날부터 14일).
  화면은 22 메일 고치기 창(recommend/mail/index.html)의 토큰과 부품을 그대로 옮겼다(§4.1-10 이메일 콤보, §4.1-5 게이팅·바닥 CTA, §4.6 완료, §5.5 토스트, §4.4 확인 창).
  다른 점 = 주소 두 번(계획 3판 — 오타로 남의 주소에 결과지가 가지 않게), 생년월일만(번호 없음 — 열쇠가 집을 정함), 맨 위에 어느 결과지인지(이름, 주소 가림).
  보내기는 한 번만, 결과는 작업 번호로 묻는다(응답이 구글 HTML로 와도 「못 보냈다」로 단정하지 않음 — 메모리 gas-webapp-reply-can-be-google-html).
  ?demo=1 = 서버 없이 화면만(&s=bounced|fixed|old|key, 주소 twice@naver.com = 같은 주소로 이미 두 번). ⚠️ 사용자 문구에 가운뎃점(U+00B7) 금지.
-->

<style>
  :root{

  .sel-list{ display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); background:#fff; border-radius:var(--r-md); box-shadow:0 6px 24px rgba(0,0,0,.14); padding:6px; z-index:10; }

  .sel-item:hover,.sel-item:active{ color:var(--green-dark); font-weight:700; }

  /* 버튼(§4.14) + 게이팅(§4.1-5) */
  .btn{ width:100%; padding:18px; border:none; border-radius:15px; font-size:17px; font-weight:700; color:#fff; background:var(--green); cursor:pointer;
        transition:transform .08s,opacity .2s; letter-spacing:-.3px; position:relative; margin-top:12px; }
  .btn:active{ transform:scale(.97); background:var(--green-dark); }
  .btn.gate{ background:var(--p-disabled); }
  .btn.gate:active{ background:var(--p-disabled); }
  .btn.weak{ background:var(--g100); color:var(--g700); }

  @keyframes shakeX{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
  .shake{ animation:shakeX .28s cubic-bezier(.36,.07,.19,.97); }
  /* 1차 CTA = 화면 하단(docs/1 §4.1-5) — 내용이 짧으면 버튼만 아래로, 길면 내용 끝에 이어진다 */
  #scr-form.on{ display:flex; flex-direction:column; min-height:calc(100svh - 68px); }

  @media (max-width:380px){ #scr-form.on{ min-height:calc(100svh - 54px); } }

  /* 완료(§4.6 — 22 .done-box 복제) */
  #scr-done.on{ display:flex; flex-direction:column; justify-content:center; min-height:calc(100svh - 68px); }
  .done-box{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 12px; }
  .done-icon{ width:80px; height:80px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; margin-bottom:22px; animation:iconPop .42s cubic-bezier(.2,.9,.3,1.3) both; }
  .done-icon svg{ width:38px; height:38px; stroke:#fff; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  @keyframes iconPop{ 0%{ transform:scale(.5); opacity:0; } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); opacity:1; } }
  .done-title{ font-size:21px; font-weight:800; letter-spacing:-.4px; line-height:1.45; }
  .done-sub{ font-size:14.5px; font-weight:500; color:var(--g700); margin-top:10px; word-break:break-all; }
  .done-sub a{ color:var(--green); font-weight:700; text-decoration:none; white-space:nowrap; }   /* 센터 번호 = 눌러서 전화 */
  #againBtn{ display:none; width:auto; padding:13px 22px; margin-top:26px; font-size:15.5px; }
  #againBtn.on{ display:inline-block; }

  /* 기다림(22 .loading 복제) + 토스트 + 확인 다이얼로그(§4.4) */
  .loading{ position:fixed; inset:0; z-index:1200; background:rgba(255,255,255,.78); display:none; flex-direction:column; gap:14px; align-items:center; justify-content:center; }
  .loading.show{ display:flex; }
  .spinner{ width:42px; height:42px; border:3px solid var(--g100); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading p{ font-size:14.5px; font-weight:600; color:var(--g600); text-align:center; }
  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--toast-bg); color:var(--toast-fg);
          font-size:14.5px; font-weight:600; padding:12px 19px; border-radius:var(--toast-r); max-width:90%; text-align:center; white-space:pre-line; opacity:0;
          transition:opacity .2s,transform .2s; pointer-events:none; z-index:1300; line-height:1.5; width:max-content; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  .dim{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1400; display:none; align-items:center; justify-content:center; }
  .dim.on{ display:flex; }
  .cmodal{ width:calc(100% - 84px); max-width:320px; background:#fff; border-radius:20px; padding:24px 20px 18px; }
  .cmodal h3{ font-size:18px; font-weight:700; letter-spacing:-.3px; line-height:1.45; }
  .cmodal p{ font-size:14.5px; color:var(--g700); margin-top:8px; line-height:1.55; word-break:break-all; }
  .cmodal p b{ color:var(--g900); }
  .cm-btns{ display:flex; gap:8px; margin-top:16px; }
  .cm-btns button{ flex:1; padding:14px 6px; border:none; border-radius:var(--r-md); font-size:15.5px; font-weight:700; cursor:pointer; transition:transform .08s; }
  .cm-btns button:active{ transform:scale(.97); }
  .cm-weak{ background:var(--g100); color:var(--g700); }
  .cm-main{ background:var(--green); color:#fff; }
</style>

<body>
<div class="wrap">
  <section class="scr" id="scr-form">
    <h1 class="app-h1">받을 메일 주소를<br>적어주세요</h1>
    <p class="app-sub" id="formSub">스팸함도 확인해주세요. 같은 주소를 적으면 한 번 더 보내드려요.</p>
    <div class="which" id="which"></div>
    <div class="field uf" id="f-dob"><label for="dob">아이 생년월일</label><div class="inw"><input class="in" id="dob" type="tel" inputmode="numeric" placeholder="0000. 00. 00" readonly autocomplete="off"><button type="button" class="clr" tabindex="-1" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button></div></div>

    </div>
    <div class="field uf" id="f-again"><label for="again">메일 주소 한 번 더</label><div class="inw"><input class="in" id="again" type="text" inputmode="email" autocapitalize="off" autocorrect="off" placeholder="예: abc@naver.com" readonly autocomplete="off"><button type="button" class="clr" tabindex="-1" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg></button></div></div>

</div></div>

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbxvWu1xR9udwKiTkZ-nk-Hvx9KPlFKyIelVCdmnVYEilmLADfZnnO2Nq4XmdpwolmG9Yg/exec';   // 07 웹앱(@ 고정 배포 — kr /month와 같은 주소)
var DEMO = /demo=1/.test(location.search);
var TEL = '032-277-5007';
var KEY = (/[?&]k=(r[0-9a-f]{21})(?:&|$)/.exec(location.search) || [])[1] || '';
// 기다리는 시간 — 묻기 5초, 보내기 응답 130초(07이 22를 최대 100초 기다림), 다 합쳐 3분 30초. 시험은 window.RS_T로 줄인다
var T = window.RS_T || { open: 8000, send: 130000, poll: 5000, total: 210000, again: 10000 };
function $(id){ return document.getElementById(id); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

/* ── 입력 공통(22 Index.html 복제) ── */
document.addEventListener('focusin', function(e){ if(e.target && e.target.tagName==='INPUT' && e.target.hasAttribute('readonly')) e.target.removeAttribute('readonly'); });   // 자동완성 막기(§4.1-6)
function wireClr(inp){
  var inw = inp.closest('.inw'); if(!inw) return; var clr = inw.querySelector('.clr');
  var upd = function(){ inw.classList.toggle('has-val', inp.value.length>0); };
  inp.addEventListener('input', upd);
  clr.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  clr.addEventListener('click', function(){ inp.value=''; inp.dispatchEvent(new Event('input')); inp.focus(); });
  upd();
}
$$('.inw input').forEach(wireClr);
document.addEventListener('input', function(e){ var fd = e.target.closest && e.target.closest('.field.err'); if(fd) fd.classList.remove('err'); });
function fmtBirth(v){ var d=String(v||'').replace(/\D/g,'').slice(0,8); var out=d.slice(0,4); if(d.length>4) out+='. '+d.slice(4,6); if(d.length>6) out+='. '+d.slice(6,8); return out; }
function validDob8(d){ if(d.length!==8) return false; var y=+d.slice(0,4), m=+d.slice(4,6), dd=+d.slice(6,8); if(y<1900||m<1||m>12||dd<1||dd>31) return false; var dt=new Date(y,m-1,dd); if(dt.getMonth()!==m-1 || dt.getDate()!==dd) return false; return dt<=new Date(); }
(function(){ var d=$('dob');
  d.addEventListener('focus', function(){ d._wasFull = d.value.replace(/\D/g,'').length>=8; });
  d.addEventListener('input', function(){ d.value=fmtBirth(d.value); if(d.value.replace(/\D/g,'').length===8 && !d._wasFull){ setTimeout(function(){ $('email').focus(); }, 60); } });
})();
// 아이디 칸에 주소를 통째로 붙여 넣으면 아이디 @ 도메인으로 나눈다(복사해 온 주소 — §4.1-9 입력 관용)
$('email').addEventListener('input', function(){
  var v=this.value.replace(/\s/g,''), at=v.indexOf('@');
  if(at>0 && /^[^@]+\.[^@]+$/.test(v.slice(at+1))){ this.value=v.slice(0,at); $('domain').value=v.slice(at+1).toLowerCase(); }
  else this.value=v.replace(/@/g,'');
});
$('again').addEventListener('input', function(){ this.value=this.value.replace(/\s/g,''); });
(function(){   // 도메인 콤보(§4.1-10)
  var wrap=$('domWrap'), inp=$('domain'), list=$('domList'), tg=$('domTg');
  function open(o){ list.classList.toggle('open', o); wrap.classList.toggle('open', o); $('f-email').classList.toggle('sopen', o); }
  tg.onclick = function(e){ e.stopPropagation(); open(!list.classList.contains('open')); };
  $$('.sel-item', list).forEach(function(it){ it.onclick = function(){ inp.value=it.textContent; open(false); gateUpdate(); }; });
  inp.addEventListener('input', function(){ inp.value=inp.value.replace(/[@\s]/g,''); });
  inp.addEventListener('focus', function(){ open(false); });
  document.addEventListener('click', function(e){ if(!wrap.contains(e.target)) open(false); });
})();
var toastT;
/* 토스트 자리 = 보이는 「결과지 다시 받기」 위 12px(docs/1 §5.5, 22 메일 창과 같은 식) */
function toastBottom(t){
  var vh=window.innerHeight, th=(t && t.offsetHeight) || 66, lim=Math.max(30, vh-th-8);
  var b=document.querySelector('#scr-form.on #sendBtn'); if(!b || !b.getClientRects().length) return '';
  var top=b.getBoundingClientRect().top; if(top>=vh) return '';
  return Math.min(Math.max(Math.round(vh-top)+12, 30), lim)+'px';
}
function toast(m, ms){ var t=$('toast'); t.textContent=m; t.style.bottom=toastBottom(t); t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, ms || 2800); }

/* ── 게이팅(§4.1-5) — 칸이 다 차기 전엔 연초록, 누르면 흔들고 빠진 칸 ── */
function addr(){ return ($('email').value.trim()+'@'+$('domain').value.trim()).toLowerCase(); }
function vals(){ return { dob:$('dob').value.replace(/\D/g,''), local:$('email').value.trim(), domain:$('domain').value.trim().toLowerCase(), again:$('again').value.trim().toLowerCase() }; }
function check(quiet){
  var v=vals(), bad=null;
  if(!validDob8(v.dob)) bad=['f-dob','아이 생년월일을 확인해주세요.'];
  else if(!v.local || !/^[^@\s]+\.[^@\s]+$/.test(v.domain)) bad=['f-email','받을 메일 주소를 확인해주세요.'];
  else if(!v.again) bad=['f-again','메일 주소를 한 번 더 적어주세요.'];
  else if(v.again!==addr()) bad=['f-again','두 메일 주소가 서로 달라요.'];
  if(bad && !quiet){ $(bad[0]).classList.add('err'); toast(bad[1]); }
  return !bad;
}
function gateUpdate(){ $('sendBtn').classList.toggle('gate', !check(true)); }
['input','change','click'].forEach(function(ev){ document.addEventListener(ev, function(){ setTimeout(gateUpdate, 0); }, true); });

/* ── 서버 — 07 웹앱. 응답이 JSON이 아니면(구글 HTML) BAD_REPLY ── */
function post(body, ms){
  if(DEMO) return demoPost(body);
  var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function(){ ctl.abort(); }, ms || 20000) : 0;
  return fetch(GAS, { method:'POST', body:JSON.stringify(body), signal: ctl ? ctl.signal : undefined }).then(function(r){ return r.text(); }).then(function(t){
    clearTimeout(tm);
    var o; try{ o = JSON.parse(t); }catch(e){ throw new Error('BAD_REPLY'); }
    if(o && o.error) throw new Error(o.error);
    return o;
  }, function(e){ clearTimeout(tm); throw e; });
}
function show(id){ $$('.scr').forEach(function(s){ s.classList.toggle('on', s.id===id); }); }
function loading(on, txt){ $('loadTxt').textContent = txt || '확인하고 있어요'; $('loading').classList.toggle('show', !!on); }
// 머무는 끝 화면 — 첫 줄 = 제목, 나머지 = 회색 서브(§4.6). 「…: 032-…」 줄의 번호는 전화 걸기 링크. ok = 체크 그림
function endNote(msg, ok, again){
  var ls=String(msg||'').split('\n'), sub=$('doneSub');
  $('doneTitle').textContent=ls[0]; sub.textContent=''; $('doneIcon').style.display = ok ? '' : 'none';
  ls.slice(1).forEach(function(l,i){
    if(i) sub.appendChild(document.createElement('br'));
    var m=/^(.*: )(0\d{1,2}-\d{3,4}-\d{4})$/.exec(l);
    if(!m){ sub.appendChild(document.createTextNode(l)); return; }
    var a=document.createElement('a'); a.href='tel:'+m[2].replace(/-/g,''); a.textContent=m[2];
    sub.appendChild(document.createTextNode(m[1])); sub.appendChild(a);
  });
  $('againBtn').classList.toggle('on', !!again);
  show('scr-done');
}
var CALL = '센터로 전화 주세요: ' + TEL;
var CALL2 = '그래도 안 오면 센터로 전화 주세요: ' + TEL;

/* ── 열기 — 어느 결과지인지 ── */
var info = null;
function paintForm(r){
  var w=$('which'); w.textContent='';
  var b=document.createElement('b'); b.textContent=r.name; w.appendChild(b);
  w.appendChild(document.createTextNode(' ' + r.what + ' 결과지'));
  var to=document.createElement('span'); to.className='to'; to.textContent='보낸 주소 ' + r.to; w.appendChild(to);
  $('formSub').textContent = r.bounced ? '보낸 메일이 돌아왔어요. 주소를 확인해서 다시 적어주세요.' : '스팸함도 확인해주세요. 같은 주소를 적으면 한 번 더 보내드려요.';
  show('scr-form'); gateUpdate();
}
function open(){
  if(!KEY && !DEMO){ endNote('링크가 맞지 않아요.\n' + CALL); return; }
  loading(true);
  var tries = 0;
  (function go(){
    tries++;
    post({ action:'rp_open', k:KEY }, T.open).then(function(r){
      loading(false); info = r;
      if(!r || !r.ok){ endNote((r && r.why==='key' ? '링크가 맞지 않아요.' : '지금은 열 수 없어요.') + '\n' + CALL); return; }
      if(r.old){ endNote('다시 받을 수 있는 기간이 지났어요.\n' + CALL); return; }
      if(r.fixed && !r.bounced){ endNote('결과지를 다시 보냈어요\n' + r.to + ' 메일함과 스팸함을 확인해주세요.\n' + CALL2, true, true); return; }
      paintForm(r);
    }).catch(function(){
      if(tries < 3){ setTimeout(go, 1200); return; }
      loading(false); endNote('지금은 열 수 없어요.\n잠시 뒤 다시 열어 주세요.');
    });
  })();
}
$('againBtn').onclick = function(){ if(info) paintForm(info); };

/* ── 보내기 — 한 번만 보내고 작업 번호로 결과를 묻는다. 다시 누름 = 새 번호, 응답을 놓쳤을 때만 같은 번호 ── */
var busy=false;
function newJob(){ return 'rp' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function send(force){
  if(busy) return;
  var v=vals(), to=addr(), job=newJob(), done=false, t0=Date.now(), pollT=0, waitT=0, lost=false, nones=0, reposts=0, agains=0, fires=0;
  var body={ action:'rp_fix', k:KEY, b6:v.dob.slice(2), to:to, force:!!force, job:job };
  busy=true; if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  loading(true, '보내고 있어요');
  waitT = setTimeout(function(){ if(!done) $('loadTxt').textContent='조금만 기다려 주세요'; }, 8000);
  function fire(){
    lost=false; fires++;   // 2번째부터 = 같은 번호로 다시 부름(앞 부름이 보냈을 수 있다)
    post(body, T.send).then(function(r){ if(r && r.why==='run') return; got(r); }, function(){ lost=true; nones=0; });
  }
  function got(r){
    if(done || !r) return;
    if((r.why==='unknown' || r.why==='retry') && agains < 3){ agains++; setTimeout(function(){ if(!done) fire(); }, T.again); return; }   // 07이 22 결과를 모름 = 같은 번호로 다시(22가 두 통을 막음)
    finish(r);
  }
  function finish(r){
    if(done) return; done=true; clearInterval(pollT); clearTimeout(waitT); busy=false; loading(false);
    if(!r || r.why==='unknown' || r.why==='retry'){ toast('결과를 아직 못 받았어요.\n잠시 뒤 메일함을 확인해주세요.', 4000); return; }
    if(r.ok){ endNote('결과지를 다시 보냈어요\n' + to + ' 메일함과 스팸함을 확인해주세요.\n' + CALL2, true); return; }
    var w=r.why;
    if(fires>1 && !/^(typo|b6|locked|addr|bounce|key|old)$/.test(w)){ toast('결과를 아직 못 받았어요.\n잠시 뒤 메일함을 확인해주세요.', 4000); return; }   // 다시 부른 뒤의 거절 = 「못 보냈어요」로 단정 X(11-24 리뷰)
    if(w==='typo'){ $('typoGot').textContent=to; $('typoFix').textContent=r.typo; $('typoDim').classList.add('on'); return; }
    if(w==='old'){ endNote('다시 받을 수 있는 기간이 지났어요.\n' + CALL); return; }
    if(w==='key'){ endNote('링크가 맞지 않아요.\n' + CALL); return; }
    if(w==='off' || w==='test_to'){ endNote('지금은 다시 보낼 수 없어요.\n' + CALL); return; }
    if(w==='file' || w==='day'){ endNote('지금은 보내지 못했어요.\n확인해서 연락드릴게요.'); return; }   // 07이 대표님께 카톡을 보냄
    if(w==='b6'){ $('f-dob').classList.add('err'); toast('아이 생년월일이 맞지 않아요.' + (r.left>0 && r.left<=2 ? '\n' + r.left + '번 더 틀리면 1시간 동안 막혀요.' : ''), 3600); return; }
    if(w==='locked'){ $('f-dob').classList.add('err'); toast('생년월일을 여러 번 틀려서\n1시간 동안 막혔어요.', 4000); return; }
    if(w==='same'){ endNote('이 주소로 이미 다시 보내드렸어요\n메일함과 스팸함을 확인해주세요.\n' + CALL2, false, true); return; }   // 07 = 그 주소로 두 번 감(처음 + 한 번 더) — 세 번째는 안 보냄, 다른 주소는 됨
    if(w==='bounce'){ $('f-email').classList.add('err'); $('f-again').classList.add('err'); toast('이 주소로 전달되지 않았어요.\n주소를 다시 확인해주세요.', 4000); return; }
    if(w==='addr'){ $('f-email').classList.add('err'); toast('받을 메일 주소를 확인해주세요.'); return; }
    toast('지금은 보내지 못했어요.\n잠시 뒤 다시 해주세요.', 3600);   // busy(다른 창에서 보내는 중, 시간당 한도), error
  }
  fire();
  pollT=setInterval(function(){
    if(done) return;
    if(Date.now()-t0 > T.total){ finish(null); return; }
    post({ action:'rp_res', job:job }, 15000).then(function(x){
      if(done || !x) return;
      if(x.state==='done'){ got(x.res); return; }
      if(x.state==='none' && lost){ nones++; if(nones>=2 && reposts<2){ reposts++; nones=0; fire(); } }   // 응답을 놓쳤고 07도 이 번호를 모름 = 요청이 안 닿음 → 같은 번호로 한 번 더
    }).catch(function(){});
  }, T.poll);
}
$('sendBtn').onclick=function(){
  var b=this; if(b.classList.contains('gate')){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); check(false); return; }
  send(false);
};
$('typoKeep').onclick=function(){ $('typoDim').classList.remove('on'); send(true); };
$('typoUse').onclick=function(){ var fix=$('typoFix').textContent.split('@'); $('email').value=fix[0]; $('domain').value=fix[1]; $('again').value=fix[0]+'@'+fix[1]; $('typoDim').classList.remove('on'); gateUpdate(); send(false); };
$('typoDim').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('on'); });

/* ── 데모(?demo=1, 서버 없음) — 생년월일 2015.03.15만 맞음, naver.con은 오타 확인, bad@로 시작하면 반송, twice@naver.com = 같은 주소로 이미 두 번 ── */
function demoPost(b){
  var s=(/[?&]s=([a-z]+)/.exec(location.search)||[])[1]||'';
  return new Promise(function(res){ setTimeout(function(){
    if(b.action==='rp_res') return res({ state:'none' });
    if(b.action==='rp_open'){
      if(s==='key') return res({ ok:false, why:'key' });
      return res({ ok:true, name:'김○나', what:'오감쑥쑥 사전검사', to:'mom***@naver.com', bounced:s==='bounced', fixed:s==='fixed', old:s==='old' });
    }
    if(b.b6!=='150315') return res({ ok:false, why:'b6', left:2 });
    if(/naver\.con$/.test(b.to) && !b.force) return res({ ok:false, why:'typo', typo:b.to.replace(/con$/,'com') });
    if(b.to==='twice@naver.com') return res({ ok:false, why:'same' });
    if(/^bad@/.test(b.to)) return res({ ok:false, why:'bounce' });
    res({ ok:true });
  }, 700); });
}
open();
</script>
