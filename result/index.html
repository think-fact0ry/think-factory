<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>검사 결과지 | 생각공작소</title>
<!--
  think-factory.kr/result/?k=<열쇠> — 보호자가 검사 결과지를 보고 저장하는 창(2026-11-25, 07 결과지발송.js — 메일 없는 판).
  입구 = 알림톡 「결과지 보기」 버튼과 대체문자 주소(`/result/?k=#{열쇠}`). 유성 11-25 「굳이 메일로 가야해? 월 계획안 처럼 알림톡으로」 → 「권장대로 이어서 진행」.
  순서 = 열기(rp_open: 어느 결과지인지, 이름 가림) → 그 사이 서버가 결과지를 미리 받아 둠(rp_warm) → 아이 생년월일 → rp_view(맞으면 PDF) → 쪽마다 위아래로, 두 손가락 확대, 파일마다 「저장」(PDF 그대로).
  서버 = 07 웹앱 doPost 공개 동작(열쇠 검사 앞). 지키는 것 = 열쇠 + 아이 생년 6자리, 1시간 5번, 합쳐 10번 틀리면 그 링크는 영영 잠김, 보낸 날부터 1년, 센터가 끈 링크.
  보기 부품 = saenggak pay(12 급여명세서) 보기 그대로(pdf.js 4.10.38 = 문서리더 사본, attachPinch) + 여러 쪽, 여러 파일. 저장 = PDF(12는 PNG — 결과지는 쪽이 여러 장이고 다른 기관에 낼 때 PDF라서, 계획 프리뷰 10판).
  입력, 끝 화면, 토스트 = 옛 다시 받기 창(22 메일 고치기 창 부품) 그대로.
  ?demo=1 = 서버 없이 화면만(생년 2015.03.15만 맞음, &s=key|off|old|locked|wait|busy|file|one). ⚠️ 사용자 문구에 가운뎃점(U+00B7) 금지(docs/1 §2.1).
-->
<meta name="robots" content="noindex">
<script>
// 카톡 인앱 브라우저 = 상하단 바가 화면을 가리고 저장이 안 될 수 있다 → 기본 브라우저로(/recommend/mail과 같은 결)
(function(){ if (/KAKAOTALK/i.test(navigator.userAgent) && !/demo=1/.test(location.search)) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); })();
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db; --g400:#b0b8c1; --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g900:#191f28;
    --green100:#f0f8f3; --green600:#3a8a5f; --green700:#166841; --green:var(--green600); --green-dark:var(--green700);
    --red:#f04452; --ink-on-dark:#F9FBFA; --p-disabled:#b7e0c8;
    --r-sm:10px; --r-md:14px;
    --fs-h1:clamp(24px,3.4vw,30px);
    --toast-bg:#333d4b; --toast-fg:#F9FBFA; --toast-r:23px; --toast-ck:18px; /* §5.5 토스트 — docs/1 §3.1 정본 사본(이 파일은 토큰동기 마커 밖, 정본 바꿀 땐 같이) */
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; background:#fff; }
  body{ font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif; color:var(--g900); line-height:1.6; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; word-break:keep-all;
        -webkit-user-select:none; user-select:none; }
  input{ -webkit-user-select:text; user-select:text; font-family:inherit; }
  button{ font-family:inherit; }
  .wrap{ max-width:540px; margin:0 auto; padding:28px 16px 40px; }
  @media (max-width:380px){ .wrap{ padding:22px 12px 32px; } }
  .scr{ display:none; } .scr.on{ display:block; }

  /* 22 「수정 찾기」 화면 골격 */
  .app-h1{ font-size:var(--fs-h1); font-weight:700; letter-spacing:-.5px; line-height:1.32; margin:8px 0 22px; }
  /* 어느 결과지인지 — 회색 상자 한 장(이름 가림) */
  .which{ background:var(--g100); border-radius:var(--r-md); padding:14px 16px; margin:0 0 28px; font-size:14.5px; color:var(--g700); line-height:1.55; }
  .which b{ color:var(--g900); font-weight:700; }

  /* 입력(22 Index.html §4.1 복제) — 밑줄형 .field.uf */
  .field{ margin-bottom:24px; }
  .field>label{ display:block; font-size:12.5px; line-height:1.5; font-weight:600; color:var(--g600); margin:0 0 5px; letter-spacing:-.2px; transition:color .15s; }
  .field:focus-within>label{ color:var(--green); }
  .in{ width:100%; padding:13px 16px; border:1.5px solid transparent; border-radius:var(--r-md); font-size:17px; font-weight:500; line-height:1.5; color:var(--g900);
       background:var(--g100); outline:none; -webkit-appearance:none; appearance:none; transition:background .15s,border-color .15s; letter-spacing:-.2px; caret-color:var(--green); }
  .in::placeholder{ color:var(--g500); font-weight:500; }
  .inw{ position:relative; }
  .clr{ display:none; position:absolute; right:0; top:50%; transform:translateY(-50%); width:15px; height:15px; border:none; border-radius:50%; background:var(--g300); color:#fff; padding:0; cursor:pointer; align-items:center; justify-content:center; }
  .inw.has-val .clr{ display:flex; }
  .clr svg{ width:7px; height:7px; display:block; }
  .field.uf .inw{ border-bottom:2px solid var(--g200); transition:border-color .15s; }
  .field.uf .inw:focus-within{ border-color:var(--green); }
  .field.uf .inw .in{ background:none; border:none; border-radius:0; padding:2px 34px 3px 0; font-size:18px; font-weight:600; line-height:1.5; }
  .field.err .inw{ border-color:var(--red); }
  .field.err>label{ color:var(--red); }

  /* 버튼(§4.14) + 게이팅(§4.1-5) */
  .btn{ width:100%; padding:18px; border:none; border-radius:15px; font-size:17px; font-weight:700; color:#fff; background:var(--green); cursor:pointer;
        transition:transform .08s,opacity .2s; letter-spacing:-.3px; position:relative; margin-top:12px; }
  .btn:active{ transform:scale(.97); background:var(--green-dark); }
  .btn.gate{ background:var(--p-disabled); }
  .btn.gate:active{ background:var(--p-disabled); }
  @keyframes shakeX{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
  .shake{ animation:shakeX .28s cubic-bezier(.36,.07,.19,.97); }
  /* 1차 CTA = 화면 하단(docs/1 §4.1-5) — 내용이 짧으면 버튼만 아래로 */
  #scr-form.on{ display:flex; flex-direction:column; min-height:calc(100svh - 68px); }
  #scr-form #viewBtn{ margin-top:auto; }
  @media (max-width:380px){ #scr-form.on{ min-height:calc(100svh - 54px); } }

  /* 끝 화면(§4.6 — 22 .done-box 복제, 실패도 같은 조판) */
  #scr-done.on{ display:flex; flex-direction:column; justify-content:center; min-height:calc(100svh - 68px); }
  .done-box{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 12px; }
  .done-title{ font-size:21px; font-weight:800; letter-spacing:-.4px; line-height:1.45; }
  .done-sub{ font-size:14.5px; font-weight:500; color:var(--g700); margin-top:16px; word-break:break-all; }   /* 16px = 유성 11-26 「이 사이 간격이 조금 좁아」(10 → 16, 끝 화면 다 같이) */
  /* 여는 동안 = 생년 칸 화면 마크업 그대로 + 덩어리만(docs/1 §5.4, kr /selected .sk 복제 — 유성 11-26). 스피너 안 겹침 */
  .sk{ pointer-events:none; }
  .sk *{ animation:none!important; transition:none!important; visibility:hidden; }
  .sk .app-h1, .sk .app-h1 *, .sk .which, .sk #viewBtn{ visibility:visible; }
  .sk .which{ color:transparent!important; }
  .sk .skt{ color:transparent!important; background-color:#e5e8eb; border-radius:6px; -webkit-box-decoration-break:clone; box-decoration-break:clone; background-image:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0)); background-size:60% 100%; background-repeat:no-repeat; animation:sksh 1.5s ease-in-out infinite!important; }
  @keyframes sksh{ 0%{ background-position:-150% 0; } 70%,100%{ background-position:250% 0; } }
  .sk #viewBtn{ background:#e5e8eb!important; color:transparent!important; box-shadow:none!important; }
  @media (prefers-reduced-motion:reduce){ .sk .skt{ animation:none!important; } }
  .wpill{ position:fixed; left:50%; top:50%; z-index:5; transform:translate(-50%,-50%); width:max-content; max-width:calc(100% - 64px); background:#fff; border-radius:14px; padding:14px 22px; box-shadow:0 4px 18px rgba(25,31,40,.12); text-align:center; font-size:15px; font-weight:600; line-height:1.45; color:#333d4b; word-break:keep-all; animation:wpin .35s ease both; }
  .wpill small{ display:block; margin-top:2px; font-size:13.5px; font-weight:500; color:#6b7684; }
  @keyframes wpin{ from{ opacity:0; } to{ opacity:1; } }
  .done-sub a{ color:var(--green); font-weight:700; text-decoration:none; white-space:nowrap; }   /* 센터 번호 = 눌러서 전화 */

  /* 보기(12 pay #pDoc 복제) — 위 머리 + 스크롤 칸(회색 바탕 위 흰 종이) */
  #scr-view{ position:fixed; inset:0; display:none; flex-direction:column; background:var(--g100); z-index:10; }
  #scr-view.on{ display:flex; }
  /* 머리 = [← 제목] 한 줄(§4.10-2, 12 pay .hd 값) — ← = 폰 뒤로와 같은 길(history.back) */
  .vhd{ flex-shrink:0; background:#fff; display:grid; grid-template-columns:40px 1fr 40px; align-items:center; gap:4px;
        min-height:calc(56px + env(safe-area-inset-top)); padding:calc(10px + env(safe-area-inset-top)) 14px 6px; border-bottom:1px solid var(--g200); }
  .vhd .t{ text-align:center; font-size:17px; font-weight:700; letter-spacing:-.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ic{ width:40px; height:40px; border:0; background:none; color:var(--g700); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .16s cubic-bezier(.3,1.6,.5,1); }
  .ic:active{ transform:scale(.82); }
  .ic svg{ width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .vb{ flex:1; min-height:0; overflow:auto; scrollbar-width:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .vb::-webkit-scrollbar{ display:none; }
  .pages{ padding:4px 12px calc(24px + env(safe-area-inset-bottom)); width:max-content; min-width:100%; }
  .dbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 2px 8px; }
  .dbar .nm{ font-size:14.5px; font-weight:700; color:var(--g700); letter-spacing:-.2px; }
  .sv{ border:0; background:none; color:var(--green); font-size:15px; font-weight:700; padding:8px 4px; cursor:pointer; white-space:nowrap; transition:transform .12s; }
  .sv:active{ transform:scale(.93); }
  .paper{ background:#fff; box-shadow:0 1px 3px rgba(25,31,40,.10); margin:0 auto 12px; }
  .paper canvas{ display:block; width:100%; height:100%; }
  .vmsg{ padding:64px 16px 0; text-align:center; color:var(--g700); font-size:15px; line-height:1.7; }
  .vmsg .sv{ display:block; margin:6px auto 0; }
  .vhint{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:rgba(25,31,40,.82); color:#fff; font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:999px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .25s; z-index:11; }
  .vhint.on{ opacity:1; }

  /* 기다림(22 .loading 복제) + 토스트 */
  .loading{ position:fixed; inset:0; z-index:1200; background:rgba(255,255,255,.78); display:none; flex-direction:column; gap:14px; align-items:center; justify-content:center; }
  .loading.show{ display:flex; }
  .spinner{ width:42px; height:42px; border:3px solid var(--g100); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading p{ font-size:14.5px; font-weight:600; color:var(--g600); text-align:center; }
  .toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--toast-bg); color:var(--toast-fg);
          font-size:14.5px; font-weight:600; padding:12px 19px 12px 15px; border-radius:var(--toast-r); max-width:90%; text-align:left; white-space:pre-line; opacity:0;
          display:flex; align-items:center; gap:8px; transition:opacity .2s,transform .2s; pointer-events:none; z-index:1300; line-height:1.5; width:max-content; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.plain{ padding:12px 19px; text-align:center; }
  .toast.plain .tk{ display:none; }
  /* 초록 원 체크(§5.5) — 「한 번 더 뒤로 가면 나가요.」에만(§4.11-4). 틀림, 기다림 안내엔 안 붙임 */
  .toast .tk{ width:var(--toast-ck); height:var(--toast-ck); border-radius:50%; background:var(--green); flex:none; display:inline-flex; align-items:center; justify-content:center; }
  .toast .tk svg{ width:11px; height:11px; fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div class="wrap">
  <section class="scr" id="scr-form">
    <h1 class="app-h1"><span class="skt">검사 결과지가<br>나왔어요</span></h1>
    <div class="which" id="which"></div>
    <div class="field uf" id="f-dob"><label for="dob">아이 생년월일</label><div class="inw"><input class="in" id="dob" type="tel" inputmode="numeric" placeholder="0000. 00. 00" readonly autocomplete="off"><button type="button" class="clr" tabindex="-1" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
    <button class="btn gate" type="button" id="viewBtn">결과지 보기</button>
  </section>

  <section class="scr" id="scr-done">
    <div class="done-box">
      <div class="done-title" id="doneTitle"></div>
      <div class="done-sub" id="doneSub"></div>
    </div>
  </section>
</div>

<section id="scr-view" aria-label="검사 결과지">
  <div class="vhd"><button class="ic" type="button" id="vBack" aria-label="뒤로"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><span class="t" id="vT"></span><span></span></div>
  <div class="vb" id="vb"></div>
</section>
<div class="vhint" id="vhint">두 손가락으로 크게 볼 수 있어요</div>

<div class="loading" id="loading"><div class="spinner"></div><p id="loadTxt">확인하고 있어요</p></div>
<div class="toast plain" id="toast" role="status" aria-live="polite"><span class="tk"><svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17 19 7.5"/></svg></span><span id="toastT"></span></div>

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbxvWu1xR9udwKiTkZ-nk-Hvx9KPlFKyIelVCdmnVYEilmLADfZnnO2Nq4XmdpwolmG9Yg/exec';   // 07 웹앱(@ 고정 배포 — kr /month와 같은 주소)
var DEMO = /demo=1/.test(location.search);
var SCENE = (/[?&]s=([a-z]+)/.exec(location.search) || [])[1] || '';
var TEL = '032-277-5007';
var KEY = (/[?&]k=(r[0-9a-f]{21})(?:&|$)/.exec(location.search) || [])[1] || '';
// 기다리는 시간 — 열기 8초(세 번), 보기 40초(원드라이브에서 받기 + 응답). 시험은 window.RS_T로 줄인다
var T = window.RS_T || { open: 8000, view: 40000, retry: 1200 };
var HINT_KEY = 'rs-hint';
function $(id){ return document.getElementById(id); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

/* ── 입력 공통(22 Index.html 복제) ── */
document.addEventListener('focusin', function(e){ if(e.target && e.target.tagName==='INPUT' && e.target.hasAttribute('readonly')) e.target.removeAttribute('readonly'); });   // 자동완성 막기(§4.1-6)
(function(){ var inp=$('dob'), inw=inp.closest('.inw'), clr=inw.querySelector('.clr');
  var upd=function(){ inw.classList.toggle('has-val', inp.value.length>0); };
  inp.addEventListener('input', upd);
  clr.addEventListener('pointerdown', function(e){ e.preventDefault(); });
  clr.addEventListener('click', function(){ inp.value=''; inp.dispatchEvent(new Event('input')); inp.focus(); });
  upd();
})();
document.addEventListener('input', function(e){ var fd = e.target.closest && e.target.closest('.field.err'); if(fd) fd.classList.remove('err'); });
function fmtBirth(v){ var d=String(v||'').replace(/\D/g,'').slice(0,8); var out=d.slice(0,4); if(d.length>4) out+='. '+d.slice(4,6); if(d.length>6) out+='. '+d.slice(6,8); return out; }
function validDob8(d){ if(d.length!==8) return false; var y=+d.slice(0,4), m=+d.slice(4,6), dd=+d.slice(6,8); if(y<1900||m<1||m>12||dd<1||dd>31) return false; var dt=new Date(y,m-1,dd); if(dt.getMonth()!==m-1 || dt.getDate()!==dd) return false; return dt<=new Date(); }
$('dob').addEventListener('input', function(){ this.value=fmtBirth(this.value); gateUpdate(); });
$('dob').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); $('viewBtn').click(); } });
function dob(){ return $('dob').value.replace(/\D/g,''); }
function gateUpdate(){ $('viewBtn').classList.toggle('gate', !validDob8(dob())); }

var toastT;
/* 토스트 자리 = 보이는 「결과지 보기」 위 12px(docs/1 §5.5, 22 메일 창과 같은 식) */
function toastBottom(t){
  var vh=window.innerHeight, th=(t && t.offsetHeight) || 66, lim=Math.max(30, vh-th-8);
  var b=document.querySelector('#scr-form.on #viewBtn'); if(!b || !b.getClientRects().length) return '';
  var top=b.getBoundingClientRect().top; if(top>=vh) return '';
  return Math.min(Math.max(Math.round(vh-top)+12, 30), lim)+'px';
}
function toast(m, ms, ok){ var t=$('toast'); $('toastT').textContent=m; t.classList.toggle('plain', !ok); t.style.bottom=toastBottom(t); t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, ms || 2800); }

/* ── 서버 — 07 웹앱. 응답이 JSON이 아니면(구글 HTML) BAD_REPLY ── */
function post(body, ms){
  if(DEMO) return demoPost(body);
  var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function(){ ctl.abort(); }, ms || 20000) : 0;
  return fetch(GAS, { method:'POST', body:JSON.stringify(body), signal: ctl ? ctl.signal : undefined }).then(function(r){ return r.text(); }).then(function(t){
    clearTimeout(tm);
    var o; try{ o = JSON.parse(t); }catch(e){ throw new Error('BAD_REPLY'); }
    if(o && o.error) throw new Error(o.error);
    return o;
  }, function(e){ clearTimeout(tm); throw e; });
}
function show(id){ $$('.scr').forEach(function(s){ s.classList.toggle('on', s.id===id); }); }
function loading(on, txt){ $('loadTxt').textContent = txt || '확인하고 있어요'; $('loading').classList.toggle('show', !!on); }
// 머무는 끝 화면 — 첫 줄 = 제목, 나머지 = 회색 서브(§4.6). 「…: 032-…」 줄의 번호는 전화 걸기 링크
function endNote(msg){
  var ls=String(msg||'').split('\n'), sub=$('doneSub');
  $('doneTitle').textContent=ls[0]; sub.textContent='';
  ls.slice(1).forEach(function(l,i){
    if(i) sub.appendChild(document.createElement('br'));
    var m=/^(.*: )(0\d{1,2}-\d{3,4}-\d{4})$/.exec(l);
    if(!m){ sub.appendChild(document.createTextNode(l)); return; }
    var a=document.createElement('a'); a.href='tel:'+m[2].replace(/-/g,''); a.textContent=m[2];
    sub.appendChild(document.createTextNode(m[1])); sub.appendChild(a);
  });
  closeView(true);
  show('scr-done');
}
var CALL = '센터로 전화 주세요: ' + TEL;
// 열 수 없는 까닭 → 끝 화면 글(07 why)
var END = {
  key: '링크가 맞지 않아요.\n' + CALL,
  off: '이 링크는 닫혔어요.\n새 결과지를 보내드릴게요.\n감사합니다 ☺️',   // 잘못 보내 닫은 링크(유성 11-26 글 그대로, 번호 안 씀)
  old: '볼 수 있는 기간이 지났어요.\n' + CALL,
  locked: '생년월일을 여러 번 틀려서 이 링크가 잠겼어요.\n' + CALL,
  file: '결과지를 불러오지 못했어요.\n확인해서 연락드릴게요.'
};

// 다시 보내서 닫힌 옛 링크(07이 off에 now = 새로 보낸 날, 받은 길을 붙여 줌) — 유성 11-26 글 그대로(번호 안 씀). 대체문자로 받은 집은 「카톡을」 → 「문자를」(Claude 정함)
//  이름은 안 보임(옛 링크를 가진 쪽이 다른 집일 수 있어서)
function endOff(r){
  var n = r && r.now;
  if(n && n.at){ endNote('이 링크는 닫혔어요.\n새 결과지를 보내드렸어요.\n' + n.at + '에 보내드린\n' + (n.via === '문자' ? '문자를' : '카톡을') + ' 확인해 주세요.\n\n감사합니다 ☺️'); return; }
  endNote(END.off);
}
function endWhy(r, fallback){
  var w = r && r.why;
  if(w === 'off'){ endOff(r); return true; }
  if(END[w]){ endNote(END[w]); return true; }
  if(fallback){ endNote(fallback); return true; }
  return false;
}

/* ── 여는 동안 = 올 화면(생년 칸 화면) 그대로 덩어리만(docs/1 §5.4, kr /selected .sk 복제 — 유성 11-26 「로딩 스피너 넣지 말고, 스켈레톤」).
   3초 「결과지를 불러오고 있어요」, 12초 「인터넷이 느리면 …」(js/form-wait.js 글 그대로) ── */
var skT=[], pill=null;
function skel(on){
  skT.forEach(clearTimeout); skT=[]; if(pill){ pill.remove(); pill=null; }
  $('scr-form').classList.toggle('sk', !!on);
  if(!on) return;
  $('which').textContent='김○나 오감쑥쑥 사전검사 결과지';   // 자리만(투명 — 뜬 화면과 같은 높이)
  show('scr-form');
  var say=function(h){ if(!pill){ pill=document.createElement('div'); pill.className='wpill'; pill.setAttribute('role','status'); document.body.appendChild(pill); } pill.innerHTML=h; };
  skT.push(setTimeout(function(){ say('결과지를 불러오고 있어요'); }, 3000));
  skT.push(setTimeout(function(){ say('인터넷이 느리면 조금 더 걸려요<small>조금만 더 기다려 주세요</small>'); }, 12000));
}

/* ── 열기 — 어느 결과지인지. 열리면 서버가 결과지를 미리 받아 두게(생년을 적는 동안) ── */
function open(){
  if(!KEY && !DEMO){ endNote(END.key); return; }
  skel(true);
  var tries = 0;
  (function go(){
    tries++;
    post({ action:'rp_open', k:KEY }, T.open).then(function(r){
      skel(false);
      if(!r || !r.ok){ endWhy(r, '지금은 열 수 없어요.\n' + CALL); return; }
      var w=$('which'); w.textContent='';
      var b=document.createElement('b'); b.textContent=r.name; w.appendChild(b);
      w.appendChild(document.createTextNode(' ' + r.what + ' 결과지'));
      show('scr-form'); gateUpdate();
      post({ action:'rp_warm', k:KEY }, 30000).catch(function(){});   // 답은 안 기다림(아무것도 안 돌려줌)
    }).catch(function(){
      if(tries < 3){ setTimeout(go, T.retry); return; }
      skel(false); endNote('지금은 열 수 없어요.\n잠시 뒤 다시 열어 주세요.');
    });
  })();
}

/* ── 보기 ── */
var busy=false, FILES=[], lastOk=null;
$('viewBtn').onclick=function(){
  var b=this;
  if(b.classList.contains('gate')){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); $('f-dob').classList.add('err'); toast('아이 생년월일을 확인해주세요.'); return; }
  if(busy) return;
  var b6=dob().slice(2);
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if(lastOk && lastOk.b6===b6){ openView(lastOk.r); return; }   // 뒤로 갔다 다시 = 받은 것 그대로(서버에 또 안 묻는다 — 연 횟수, 틀림 칸이 안 늘게)
  busy=true;
  loading(true, '결과지를 펼치고 있어요');
  post({ action:'rp_view', k:KEY, b6:b6 }, T.view).then(function(r){
    busy=false; loading(false);
    if(r && r.ok){ lastOk={ b6:b6, r:r }; openView(r); return; }
    var w = r && r.why;
    if(w==='b6'){ $('f-dob').classList.add('err'); toast('아이 생년월일이 맞지 않아요.' + (r.left>0 && r.left<=2 ? '\n' + r.left + '번 더 틀리면 이 링크가 잠겨요.' : ''), 3600); return; }
    if(w==='wait'){ $('f-dob').classList.add('err'); toast('여러 번 틀려서 잠시 쉬어요.\n1시간 뒤에 다시 해주세요.', 4000); return; }
    if(w==='busy'){ toast('지금은 열 수 없어요.\n잠시 뒤 다시 해주세요.', 3600); return; }
    if(endWhy(r)) return;
    toast('결과지를 아직 못 불러왔어요.\n잠시 뒤 다시 해주세요.', 3600);
  }).catch(function(){ busy=false; loading(false); toast('결과지를 아직 못 불러왔어요.\n잠시 뒤 다시 해주세요.', 3600); });
};

/* ── 펼치기(pdf.js — 문서리더 벤더 그대로, 처음 필요할 때만 받는다) ── */
var pdfjsP = null;
function pdfjs(){
  if(!pdfjsP) pdfjsP = import('./vendor/pdfjs/pdf.min.mjs').then(function(m){ m.GlobalWorkerOptions.workerSrc = new URL('vendor/pdfjs/pdf.worker.min.mjs', location.href).href; return m; });
  return pdfjsP;
}
function b64ToBytes(b64){ var s=atob(b64), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
// 파일 이름 → 칸 이름(「김가나_사전검사_결과지.pdf」 → 「사전검사 결과지」)
function fileLabel(name){ return String(name||'').replace(/\.pdf$/i,'').replace(/^[^_]*_/,'').replace(/_/g,' ') || '결과지'; }
var view=null;   // { docs:[{pages:[{page, paper, drawn}]}], pinch, W }
function openView(r){
  FILES = (r.files||[]).map(function(f){ return { name:f.name, bytes:b64ToBytes(f.b64) }; });
  $('vT').textContent = (r.name ? r.name + ' ' : '') + (r.what || '') + ' 결과지';
  var vb=$('vb'); vb.innerHTML=''; vb.scrollTop=0; vb.scrollLeft=0;
  var pages=document.createElement('div'); pages.className='pages'; vb.appendChild(pages);
  var mine = view = { docs:[] };
  $('scr-view').classList.add('on');
  armed=false; clearTimeout(armT);
  try{ history.pushState({ rs:'view' }, ''); }catch(e){}
  var W = Math.max(200, vb.clientWidth - 24);
  mine.W = W;
  FILES.forEach(function(f, i){
    var bar=document.createElement('div'); bar.className='dbar';
    var nm=document.createElement('span'); nm.className='nm'; nm.textContent=fileLabel(f.name); bar.appendChild(nm);
    var sv=document.createElement('button'); sv.type='button'; sv.className='sv'; sv.textContent='저장'; sv.onclick=function(){ save(i); }; bar.appendChild(sv);
    pages.appendChild(bar);
    var box=document.createElement('div'); box.className='doc'; pages.appendChild(box);
    f.box=box;
  });
  pdfjs().then(function(lib){
    return FILES.reduce(function(p, f){ return p.then(function(){ return drawDoc(lib, f, mine); }); }, Promise.resolve());
  }).then(function(){
    if(view !== mine) return;
    mine.pinch = attachPinch(vb, function(){ return pages; }, { min:1, max:3.5, onEnd:function(z){ redraw(mine, z); } });
    firstHint();
  }).catch(function(){
    if(view !== mine) return;
    vb.innerHTML='<div class="vmsg">이 기기에서 결과지를 펼치지 못했어요</div>';
    var m=vb.querySelector('.vmsg');
    FILES.forEach(function(f, i){ var b=document.createElement('button'); b.type='button'; b.className='sv'; b.textContent=fileLabel(f.name) + ' 파일로 받기'; b.onclick=function(){ save(i); }; m.appendChild(b); });
  });
}
function drawDoc(lib, f, mine){
  return lib.getDocument({ data:f.bytes.slice() }).promise.then(function(doc){
    var d={ doc:doc, pages:[] }; mine.docs.push(d);
    var n=doc.numPages, chain=Promise.resolve();
    for(var p=1; p<=n; p++) (function(p){
      chain = chain.then(function(){ return doc.getPage(p).then(function(page){
        if(view !== mine) return;
        var vp1=page.getViewport({ scale:1 }), paper=document.createElement('div');
        paper.className='paper'; paper.style.width=mine.W+'px'; paper.style.height=Math.round(mine.W*vp1.height/vp1.width)+'px';
        f.box.appendChild(paper);
        var pg={ page:page, vp1:vp1, paper:paper, drawn:0 }; d.pages.push(pg);
        return drawPage(pg, mine, 1);
      }); });
    })(p);
    return chain;
  });
}
// 한 쪽 그리기 — 배율 z(손가락 확대가 멈추면 그 배율로 다시 선명하게, 쪽마다 12MP 상한)
function drawPage(pg, mine, z){
  var dpr=Math.min(window.devicePixelRatio || 1, 2), sc=(mine.W/pg.vp1.width)*dpr*Math.max(1, z);
  var px=pg.vp1.width*sc*pg.vp1.height*sc; if(px>12e6) sc*=Math.sqrt(12e6/px);
  if(Math.abs(sc-pg.drawn)<0.01) return Promise.resolve();
  pg.drawn=sc;
  var vp=pg.page.getViewport({ scale:sc }), cv=document.createElement('canvas');
  cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
  return pg.page.render({ canvasContext:cv.getContext('2d'), viewport:vp }).promise.then(function(){
    if(view !== mine) return; pg.paper.innerHTML=''; pg.paper.appendChild(cv);
  });
}
function redraw(mine, z){ mine.docs.forEach(function(d){ d.pages.forEach(function(pg){ drawPage(pg, mine, z); }); }); }
function closeView(quiet){
  if(view){ view.docs.forEach(function(d){ try{ d.doc.destroy(); }catch(e){} }); }
  view=null; $('scr-view').classList.remove('on'); $('vhint').classList.remove('on');
}
/* 뒤로(§4.11) — 보기 → 생년 칸 → 「한 번 더 뒤로 가면 나가요.」 2초 → 나감. 처음 칸 = root + guard 1칸(단독 페이지), 보기 = view 1칸 더.
   첫 뒤로엔 guard를 다시 안 쌓는다(두 번째 뒤로가 진짜 나가게) — 2초 지나면 다시 쌓음(continue/ 페이지와 같은 꼴) */
function hState(){ return (history.state && history.state.rs) || null; }
var armed=false, armT=0;
try{
  if(!hState()){ history.replaceState({ rs:'root' }, ''); history.pushState({ rs:'guard' }, ''); }
  else if(hState()==='view') history.back();   // 보는 중에 새로 고침 = 남은 view 칸을 먼저 걷음(안 그러면 다음 뒤로 한 번이 조용히 먹힌다)
}catch(e){}
function rearm(){ clearTimeout(armT); if(!armed) return; armed=false; if(hState()==='root'){ try{ history.pushState({ rs:'guard' }, ''); }catch(e){} } }
window.addEventListener('popstate', function(e){
  var st=(e.state && e.state.rs) || 'root';
  if(view){ closeView(); show('scr-form'); gateUpdate(); if(st!=='root') return; }
  if(st!=='root') return;
  armed=true; toast('한 번 더 뒤로 가면 나가요.', 2000, true);
  armT=setTimeout(rearm, 2000);
});
document.addEventListener('pointerdown', function(){ if(armed) rearm(); }, true);
$('vBack').onclick=function(){ try{ history.back(); }catch(e){ closeView(); show('scr-form'); } };
function firstHint(){   // 처음 한 번만(이 기기) — 확대가 된다는 걸 모르면 작은 글자를 그대로 읽게 된다
  var seen=false; try{ seen=!!localStorage.getItem(HINT_KEY); localStorage.setItem(HINT_KEY,'1'); }catch(e){}
  if(seen && !DEMO) return;
  var h=$('vhint'); h.classList.add('on'); setTimeout(function(){ h.classList.remove('on'); }, 2600);
}
// 저장 = PDF 그대로(받은 파일 이름 = 「김가나_사전검사_결과지.pdf」)
function save(i){
  var f=FILES[i]; if(!f) return;
  var url=URL.createObjectURL(new Blob([f.bytes], { type:'application/pdf' }));
  var a=document.createElement('a'); a.href=url; a.download=f.name || '검사결과지.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
// 두 손가락 확대 = 문서리더 attachPinch(CSS zoom + 손가락 가운데 고정) + 두 번 탭 = 1 ↔ 2.5배 (12 pay.js 그대로)
function attachPinch(scroller, getTarget, opts){
  var min=opts.min||1, max=opts.max||3, startDist=0, startZ=1, z=1, pinching=false, raf=0, pend=null, lastTap=0, lx=0, ly=0;
  var dist=function(e){ return Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); };
  function setZ(nz, mx, my){
    var prev=z; z=nz; var t=getTarget(); if(!t) return;
    var sx=scroller.scrollLeft, sy=scroller.scrollTop; t.style.zoom=z;
    var k=z/prev; scroller.scrollLeft=(sx+mx)*k-mx; scroller.scrollTop=(sy+my)*k-my;
  }
  var apply=function(){ raf=0; if(!pend) return; var p=pend; pend=null; setZ(p.nz, p.mx, p.my); };
  scroller.addEventListener('touchstart', function(e){ if(e.touches.length===2){ pinching=true; startDist=dist(e); startZ=z; } }, { passive:true });
  scroller.addEventListener('touchmove', function(e){
    if(!pinching || e.touches.length!==2) return;
    e.preventDefault();
    var r=scroller.getBoundingClientRect();
    pend={ nz:Math.min(max, Math.max(min, startZ*dist(e)/startDist)), mx:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, my:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top };
    if(!raf) raf=requestAnimationFrame(apply);
  }, { passive:false });
  var end=function(){ if(pinching){ pinching=false; if(opts.onEnd) opts.onEnd(z); } };
  scroller.addEventListener('touchend', function(e){
    end();
    if(e.changedTouches.length!==1 || e.touches.length) return;
    var t=e.changedTouches[0], now=Date.now();
    if(now-lastTap<300 && Math.abs(t.clientX-lx)<24 && Math.abs(t.clientY-ly)<24){ lastTap=0; e.preventDefault(); toggle(t.clientX, t.clientY); }
    else { lastTap=now; lx=t.clientX; ly=t.clientY; }
  }, { passive:false });
  scroller.addEventListener('touchcancel', end, { passive:true });
  function toggle(cx, cy){ var r=scroller.getBoundingClientRect(); setZ(z>1.2 ? 1 : 2.5, cx-r.left, cy-r.top); if(opts.onEnd) opts.onEnd(z); }
  return { get z(){ return z; } };
}

/* ── 데모(?demo=1, 서버 없음) — 생년월일 2015.03.15만 맞음. 결과지 = demo/ 가짜 PDF 둘(김하나)
   s=new / newsms = 다시 보내서 닫힌 옛 링크(07 off + now), slow=N = 여는 데 N초(스켈레톤, 알약 보기) ── */
var SLOW = +((/[?&]slow=([0-9]+)/.exec(location.search) || [])[1] || 0);
function demoPost(b){
  return new Promise(function(res){ setTimeout(function(){
    if(b.action==='rp_warm') return res({ ok:true });
    if(b.action==='rp_open'){
      if(SCENE==='new') return res({ ok:false, why:'off', now:{ at:'11월 26일', via:'카톡' } });
      if(SCENE==='newsms') return res({ ok:false, why:'off', now:{ at:'11월 26일', via:'문자' } });
      if(/^(key|off|old|locked)$/.test(SCENE)) return res({ ok:false, why:SCENE });
      return res({ ok:true, name:'김○나', what:'오감쑥쑥 사전검사', n: SCENE==='one' ? 1 : 2 });
    }
    if(SCENE==='busy') return res({ ok:false, why:'busy' });
    if(SCENE==='wait') return res({ ok:false, why:'wait' });
    if(b.b6!=='150315') return res({ ok:false, why:'b6', left:2 });
    if(SCENE==='file') return res({ ok:false, why:'file' });
    var list = SCENE==='one' ? ['김하나_사전검사_결과지.pdf'] : ['김하나_사전검사_결과지.pdf', '김하나_부모양육태도검사.pdf'];
    Promise.all(list.map(function(n){ return fetch('demo/' + encodeURIComponent(n)).then(function(r){ return r.arrayBuffer(); }).then(function(ab){
      var u=new Uint8Array(ab), s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return { name:n, b64:btoa(s) };
    }); })).then(function(files){ res({ ok:true, name:'김하나', what:'오감쑥쑥 사전검사', files:files }); });
  }, b.action==='rp_open' && SLOW ? SLOW*1000 : 500); });
}
open();
